<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>작도 교실</title>
<style>
  :root{
    --deep:#081A2E; --deep2:#113A63;
    --glass:rgba(255,255,255,.10); --glass2:rgba(255,255,255,.16); --glass3:rgba(255,255,255,.22);
    --edge:rgba(150,205,255,.30); --edge2:rgba(170,220,255,.55);
    --text:#E8F1FB; --muted:#9DB4CE;
    --cobalt:#3B82F6; --cyan:#22D3EE; --amber:#F6B93B; --mint:#34D399; --rose:#FB7185;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--text);
    font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:
      radial-gradient(1100px 620px at 12% -8%, #1C5285 0%, rgba(28,82,133,0) 62%),
      radial-gradient(900px 560px at 98% 4%, #0E5C73 0%, rgba(14,92,115,0) 58%),
      linear-gradient(170deg, var(--deep) 0%, var(--deep2) 58%, #0A2742 100%);
    background-attachment:fixed;
  }
  /* 제도용지 모눈 */
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(rgba(140,200,255,.055) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(140,200,255,.055) 1px,transparent 1px);
    background-size:34px 34px;
  }
  header,main,footer{position:relative;z-index:1}
  .glass{
    background:var(--glass);
    border:1px solid var(--edge);
    border-radius:var(--r);
    backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.26), 0 10px 30px rgba(3,16,32,.30);
  }
  header{
    /* 아래 main 과 같은 칸 나누기: 제목 | 작도판이 시작되는 자리 | 학번·점수 */
    /* 첫 칸은 도구 패널(176px)에서 머리글 자체의 여백 12px 을 뺀 값입니다 */
    display:grid;grid-template-columns:164px minmax(0,1fr) auto;align-items:center;gap:12px;
    padding:12px;margin:12px auto 0;max-width:1580px;width:calc(100% - 24px);
    background:var(--glass2);border:1px solid var(--edge);border-radius:var(--r);
    backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 10px 30px rgba(3,16,32,.28);
  }
  header h1{font-size:19px;margin:0;letter-spacing:-.01em;font-weight:800;display:flex;align-items:center;gap:9px}
  header h1 svg{width:26px;height:26px;opacity:.95}
  .who{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-self:end}
  .who input{
    padding:8px 11px;border:1px solid var(--edge);border-radius:10px;font-size:15px;width:118px;
    font-family:inherit;background:rgba(255,255,255,.09);color:var(--text);
  }
  .who input::placeholder{color:rgba(205,222,240,.55)}
  .who input:focus{outline:2px solid var(--cyan);outline-offset:1px;background:rgba(255,255,255,.14)}
  .meter{
    display:flex;align-items:baseline;gap:6px;padding:6px 14px;border-radius:999px;
    background:rgba(255,255,255,.10);border:1px solid var(--edge);
    font-variant-numeric:tabular-nums;
  }
  .meter .lab{font-size:11.5px;font-weight:700;color:rgba(214,232,250,.78);letter-spacing:-.01em}
  .meter .val{font-size:17px;font-weight:800;letter-spacing:-.01em}
  .meter .sym{font-size:13px}
  .meter.coin .val,.meter.coin .sym{color:var(--amber)}
  .meter.score .val{color:var(--cyan)}
  .hintbtn{
    display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:999px;
    border:1px solid rgba(246,185,59,.55);background:rgba(246,185,59,.18);color:#FCE9BE;
    font-family:inherit;font-size:13px;font-weight:800;line-height:1;cursor:pointer;white-space:nowrap;
  }
  .hintbtn:hover{background:rgba(246,185,59,.28)}
  .hintbtn:disabled{opacity:.5;cursor:default}
  .hintbtn .c{font-weight:700;opacity:.9}
  main{display:grid;grid-template-columns:176px minmax(0,1fr) 320px;gap:12px;padding:12px;max-width:1580px;margin:0 auto;align-items:start}
  .card{
    background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);padding:11px;
    backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 10px 26px rgba(3,16,32,.26);
  }
  h3.sec{font-size:11.5px;letter-spacing:.06em;color:var(--muted);margin:2px 0 9px;font-weight:700}
  .tools{display:flex;flex-direction:column;gap:7px}
  .tool-btn{
    display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 5px;
    border:1px solid var(--edge);border-radius:12px;background:rgba(255,255,255,.07);
    cursor:pointer;font-size:13.5px;font-weight:700;color:var(--text);font-family:inherit;line-height:1.25;
    transition:background .15s, border-color .15s, transform .08s;
  }
  .tool-btn small{font-weight:400;color:var(--muted)}
  .tool-btn svg{width:30px;height:30px}
  .tool-btn:hover{background:rgba(255,255,255,.13)}
  .tool-btn:active{transform:translateY(1px)}
  .tool-btn.active{
    background:linear-gradient(180deg, rgba(34,211,238,.26), rgba(59,130,246,.20));
    border-color:var(--edge2);color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 0 0 1px rgba(34,211,238,.35);
  }
  .sub{display:flex;flex-direction:column;gap:4px;font-size:12.5px;padding:7px 3px 2px;border-top:1px solid rgba(150,205,255,.18);color:var(--text)}
  .sub label{cursor:pointer;display:flex;align-items:center;gap:5px}
  .widthbox{font-size:12px;background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.32);border-radius:10px;padding:7px;margin-top:6px;line-height:1.5}
  .widthbox b{color:var(--cyan)}
  .mini{width:100%;padding:6px;margin-top:5px;border:1px solid var(--edge);border-radius:9px;background:rgba(255,255,255,.08);font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:700;color:var(--text)}
  .mini:hover{background:rgba(255,255,255,.14)}
  /* 제목 줄에 놓인 화면 조작 단추 — 이동 / 확대 / 축소 를 따로 둡니다 */
  .viewbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-self:start}
  .vbtn{
    display:inline-flex;flex-direction:row;align-items:center;gap:6px;width:auto;
    padding:7px 13px;border:1px solid var(--edge);border-radius:999px;
    background:rgba(255,255,255,.08);color:var(--text);font-family:inherit;
    font-size:12.8px;font-weight:700;line-height:1;white-space:nowrap;cursor:pointer;
  }
  .vbtn:hover{background:rgba(255,255,255,.15)}
  .vbtn svg{width:17px;height:17px;flex:none}
  .vbtn.active{
    background:linear-gradient(180deg,rgba(34,211,238,.26),rgba(59,130,246,.20));
    border-color:var(--edge2);color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.42), 0 0 0 1px rgba(34,211,238,.32);
  }
  .skill{
    display:flex;align-items:center;gap:7px;width:100%;padding:8px 9px;border:1px solid var(--edge);
    border-radius:10px;background:rgba(255,255,255,.07);font-size:13px;cursor:pointer;font-family:inherit;
    text-align:left;margin-bottom:5px;color:var(--text);font-weight:700;
  }
  .skill:hover{background:rgba(255,255,255,.13)}
  .skill.locked{opacity:.38;cursor:not-allowed;font-weight:400}
  .skill.active{background:linear-gradient(180deg,rgba(34,211,238,.26),rgba(59,130,246,.18));border-color:var(--edge2);color:#fff}
  .skill .k{font-size:15px}
  /* 작도판 오른쪽 위에 번호로 쌓이는 스킬 */
  #skillDock{position:absolute;top:9px;right:9px;z-index:3;display:flex;flex-direction:column;
    gap:5px;align-items:flex-end;pointer-events:none;line-height:1}
  #skillDock .dockcap{
    font-size:9.5px;font-weight:800;letter-spacing:.04em;color:#DCEEFF;
    background:rgba(11,37,69,.74);border:1px solid rgba(150,205,255,.3);border-radius:999px;
    padding:3px 8px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .skrow{display:flex;align-items:center;gap:5px;pointer-events:none}
  .sknum{
    pointer-events:auto;width:31px;height:31px;flex:none;border-radius:50%;cursor:pointer;
    border:1px solid rgba(150,205,255,.34);background:rgba(11,37,69,.74);color:#DCEEFF;
    font-family:inherit;font-size:14px;font-weight:800;line-height:1;padding:0;
    font-variant-numeric:tabular-nums;
    backdrop-filter:blur(10px) saturate(150%);-webkit-backdrop-filter:blur(10px) saturate(150%);
    box-shadow:0 6px 16px rgba(3,16,32,.26);
  }
  .sknum:hover{background:rgba(23,62,106,.86)}
  .sknum.on{
    background:linear-gradient(180deg,rgba(34,211,238,.9),rgba(59,130,246,.85));
    border-color:#BFE9FF;color:#06243D;
  }
  .sklabel{
    display:none;pointer-events:none;white-space:nowrap;border-radius:999px;padding:5px 10px;
    font-size:11.5px;font-weight:700;color:#DCEEFF;background:rgba(11,37,69,.82);
    border:1px solid rgba(150,205,255,.34);
    backdrop-filter:blur(10px) saturate(150%);-webkit-backdrop-filter:blur(10px) saturate(150%);
  }
  .sklabel .c{opacity:.72;font-weight:600;margin-left:4px}
  .skrow:hover .sklabel,.skrow.on .sklabel{display:block}
  #board{padding:0;overflow:hidden;position:relative;display:flex;flex-direction:column}
  .boardwrap{flex:1;min-height:0;display:flex}
  .cvbox{position:relative;line-height:0;flex:1;min-width:0}
  canvas{display:block;touch-action:none;cursor:crosshair;background:#FBFDFF}
  /* 작도판 왼쪽 위의 조작 단추 */
  #boardbar{position:absolute;top:9px;left:9px;z-index:3;display:flex;gap:5px;align-items:center;line-height:1}
  .bb{
    display:inline-flex;align-items:center;justify-content:center;gap:5px;height:31px;padding:0 12px;
    border-radius:999px;border:1px solid rgba(150,205,255,.34);background:rgba(11,37,69,.74);
    color:#DCEEFF;font-family:inherit;font-size:12.5px;font-weight:700;line-height:1;cursor:pointer;
    backdrop-filter:blur(10px) saturate(150%);-webkit-backdrop-filter:blur(10px) saturate(150%);
    box-shadow:0 6px 16px rgba(3,16,32,.26);white-space:nowrap;
  }
  .bb:hover:not(:disabled){background:rgba(23,62,106,.86)}
  .bb:disabled{opacity:.4;cursor:default}
  .bb.ic{width:31px;padding:0}
  .bb.ic svg{width:17px;height:17px}
  .bb.go{background:linear-gradient(180deg,#3B82F6,#2563EB);border-color:rgba(190,225,255,.5);color:#fff}
  .bb.go:hover{background:linear-gradient(180deg,#4C8DF8,#2E6CE8)}
  .bb.send{background:linear-gradient(180deg,#10B981,#059669);border-color:rgba(190,255,230,.45);color:#fff}
  .bb.send:hover{background:linear-gradient(180deg,#17C78B,#06A678)}
  canvas.panning{cursor:grab}
  #hint{display:flex;align-items:center;gap:12px;padding:8px 13px;font-size:14px;color:var(--text);
        background:rgba(255,255,255,.07);border-top:1px solid var(--edge);min-height:37px}
  #hintText{flex:1;min-width:0}
  #hintTips{font-size:11.5px;color:var(--muted);white-space:nowrap;display:flex;align-items:center}
  #hintTips .dot{margin:0 4px 0 11px}
  #hintTips .dot:first-child{margin-left:0}
  #hintTips .keys{margin-left:14px;padding-left:14px;border-left:1px solid rgba(150,205,255,.25)}
  @media (max-width:1180px){ #hintTips{display:none} }
  #hint.flash{background:rgba(246,185,59,.22)}
  .panel{display:flex;flex-direction:column;gap:11px}
  .tabs{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(6,auto);gap:6px}
  .tab{
    font-size:12.5px;white-space:normal;line-height:1.35;padding:9px 6px;border:1px solid var(--edge);
    border-radius:11px;background:rgba(255,255,255,.07);font-weight:800;cursor:pointer;font-family:inherit;color:var(--text);
  }
  .tab:hover{background:rgba(255,255,255,.13)}
  .tab.on{background:linear-gradient(180deg,rgba(34,211,238,.30),rgba(59,130,246,.22));border-color:var(--edge2);color:#fff}
  .tab.lock{opacity:.4;cursor:not-allowed}
  .tab[data-stage="step1"]{grid-column:1;grid-row:1/3}
  .tab[data-stage="step2"]{grid-column:1;grid-row:3/5}
  .tab[data-stage="step3"]{grid-column:1;grid-row:5/7}
  .tab[data-stage="practice"]{grid-column:2;grid-row:1/4}
  .tab[data-stage="bonus"]{grid-column:2;grid-row:4/7}
  .plist{display:flex;flex-wrap:wrap;gap:5px}
  .pbtn{
    width:31px;height:31px;border-radius:9px;border:1px solid var(--edge);background:rgba(255,255,255,.07);
    font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--text);font-variant-numeric:tabular-nums;
  }
  .pbtn:hover{background:rgba(255,255,255,.14)}
  .pbtn.on{background:linear-gradient(180deg,rgba(34,211,238,.34),rgba(59,130,246,.26));border-color:var(--edge2);color:#fff}
  .pbtn.done{background:rgba(52,211,153,.20);border-color:rgba(52,211,153,.5);color:#BFF4DF}
  .pbtn.lock{opacity:.35;cursor:not-allowed}
  .ptitle{font-size:16px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
  .pdesc{font-size:14.5px;line-height:1.62;margin:0;color:#D5E5F6}
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center}
  .stat{background:rgba(255,255,255,.07);border:1px solid rgba(150,205,255,.2);border-radius:10px;padding:7px 3px}
  .stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--muted)}
  .btn{
    padding:10px;border-radius:10px;border:1px solid var(--edge);background:rgba(255,255,255,.08);
    font-size:14.5px;cursor:pointer;font-weight:700;font-family:inherit;color:var(--text);
  }
  .btn:hover{background:rgba(255,255,255,.15)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:linear-gradient(180deg,#3B82F6,#2563EB);border-color:rgba(190,225,255,.5);color:#fff}
  .btn.primary:hover{background:linear-gradient(180deg,#4C8DF8,#2E6CE8)}
  .btn.success{background:linear-gradient(180deg,#10B981,#059669);border-color:rgba(190,255,230,.45);color:#fff}
  .btn.success:hover{background:linear-gradient(180deg,#17C78B,#06A678)}
  /* 문제 설명 아래에 뜨는 힌트 */
  .hintpane{
    display:none;margin-top:10px;padding:10px 11px;border-radius:12px;
    background:rgba(246,185,59,.13);border:1px solid rgba(246,185,59,.42);color:#FBE8C2;
  }
  .hintpane.show{display:block}
  .hintpane .hd{display:flex;align-items:center;gap:7px;margin-bottom:5px}
  .hintpane .hd b{font-size:12.5px;font-weight:800;letter-spacing:-.01em;color:#FFE3A6}
  .hintpane .hd .x{
    margin-left:auto;width:23px;height:23px;flex:none;border-radius:50%;cursor:pointer;
    border:1px solid rgba(246,185,59,.5);background:rgba(246,185,59,.14);color:#FBE8C2;
    font-family:inherit;font-size:13px;font-weight:800;line-height:1;padding:0;
  }
  .hintpane .hd .x:hover{background:rgba(246,185,59,.3)}
  .hintpane .bd{font-size:13.5px;line-height:1.62}
  .hintpane .bd b{color:#FFF1D4}
  .hintpane .hnav{display:flex;gap:6px;margin-top:9px}
  .hintpane .nb{
    flex:1;padding:7px 8px;border-radius:9px;cursor:pointer;font-family:inherit;
    border:1px solid rgba(246,185,59,.45);background:rgba(246,185,59,.14);color:#FBE8C2;
    font-size:12.5px;font-weight:700;white-space:nowrap;
  }
  .hintpane .nb:hover:not(:disabled){background:rgba(246,185,59,.3)}
  .hintpane .nb:disabled{opacity:.38;cursor:default}
  .hintpane .nb.buy{background:rgba(246,185,59,.26);border-color:rgba(246,185,59,.6);color:#FFF1D4}
  .hintpane .nb .c{font-weight:800;opacity:.95;margin-left:3px}
  .hintpane .re{
    margin-top:8px;padding:6px 11px;border-radius:9px;cursor:pointer;font-family:inherit;
    border:1px solid rgba(246,185,59,.45);background:rgba(246,185,59,.16);color:#FBE8C2;
    font-size:12px;font-weight:700;
  }
  .hintpane .re:hover{background:rgba(246,185,59,.3)}
  .hintagain{
    display:block;width:100%;margin-top:9px;padding:7px;border-radius:9px;cursor:pointer;
    border:1px dashed rgba(246,185,59,.45);background:transparent;color:rgba(251,232,194,.85);
    font-family:inherit;font-size:12px;font-weight:700;
  }
  .hintagain:hover{background:rgba(246,185,59,.14)}
  .msg{position:relative;margin-top:10px;padding:10px 32px 10px 12px;border-radius:12px;
       font-size:13px;line-height:1.6;display:none;border:1px solid transparent}
  .msg.show{display:block}
  .msgx{
    position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:50%;cursor:pointer;
    border:1px solid currentColor;background:transparent;color:inherit;opacity:.72;
    font-family:inherit;font-size:12px;font-weight:800;line-height:1;padding:0;
  }
  .msgx:hover{opacity:1}
  .msg.ok{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.45);color:#C7F5E3}
  .msg.warn{background:rgba(246,185,59,.16);border-color:rgba(246,185,59,.45);color:#FBE6BC}
  .msg.err{background:rgba(251,113,133,.16);border-color:rgba(251,113,133,.45);color:#FFD2DA}
  .msg.info{background:rgba(34,211,238,.14);border-color:rgba(34,211,238,.4);color:#CBF2FA}
  .legend{font-size:11.5px;color:var(--muted);line-height:1.75}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
  footer{text-align:center;padding:16px;font-size:12px;color:rgba(190,212,234,.6)}
  .modal{position:fixed;inset:0;background:rgba(5,16,30,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal.hidden{display:none}
  .modal-box{
    background:rgba(18,48,80,.86);border:1px solid var(--edge2);border-radius:16px;padding:22px;max-width:380px;width:90%;
    backdrop-filter:blur(18px) saturate(150%);box-shadow:0 24px 60px rgba(2,12,26,.5);
  }
  .modal-box p{margin:0 0 16px;line-height:1.6}
  .modal-box .row{display:flex;gap:8px;justify-content:flex-end}
  /* 넓은 화면에서는 웹앱 전체가 한 화면에 들어옵니다 */
  @media (min-width:1051px){
    html,body{height:100%;overflow:hidden}
    body{display:flex;flex-direction:column}
    main{flex:1;min-height:0;width:100%;padding:10px 12px;align-items:stretch;
         grid-template-rows:minmax(0,1fr)}
    #board{height:100%;min-height:0}
    main > aside.card,main > .panel{max-height:100%;overflow-y:auto;overflow-x:hidden}
    main > aside.card{align-self:start}   /* 도구 칸은 내용만큼만 */
    main > aside.card::-webkit-scrollbar,main > .panel::-webkit-scrollbar{width:7px}
    main > aside.card::-webkit-scrollbar-thumb,main > .panel::-webkit-scrollbar-thumb{
      background:rgba(150,205,255,.26);border-radius:9px}
    .panel{gap:8px}
    .card{padding:9px}
    .tab{padding:7px 6px;font-size:12px}
    .tabs{gap:5px}
    .pbtn{width:28px;height:28px;font-size:12.5px}
    .stat{padding:5px 3px}
    .stat b{font-size:17px}
    .ptitle{font-size:15px;margin-bottom:4px}
    .pdesc{font-size:14px;line-height:1.55}
    .legend{font-size:11px;line-height:1.6}
    .msg{font-size:12.5px;padding:9px 30px 9px 11px}
    footer{padding:7px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:1050px){
    header{display:flex;flex-wrap:wrap;justify-content:space-between}
    main{grid-template-columns:1fr}
    /* 좁은 화면에서는 작도판이 맨 위에 옵니다 */
    #board{order:1}
    main > aside.card{order:2}
    main > .panel{order:3}
    .tools{flex-direction:row;flex-wrap:wrap}
    .tool-btn{flex:1;min-width:78px}
    .sub{width:100%;flex-direction:row;flex-wrap:wrap;gap:12px}
    .boardwrap{flex:none;display:block}

<script>
// ===================================================================
//  교사 설정
// ===================================================================
const CONFIG = {
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbylKv-2aEmBrHEjGc6TXWj-rVbUkrX7_OPh4u5cG3_xgfrsgyBUH7SizT363ZlbkCUCzg/exec',
  FOOTER: '© 2026 또빈쌤. All rights reserved.',
  LOCK_ORDER: false,     // true 로 바꾸면 앞 문제를 풀어야 다음 문제가 열립니다
  COUNT_WIDTH_AS_COMPASS: false, // true 로 바꾸면 '길이 재기'(폭 변경)도 컴퍼스 1회로 셉니다
  LOCK_STAGES: false,    // true 로 바꾸면 평행선은 기본 작도를, 보너스·도전은 평행선을 끝내야 열립니다
  SEND_IMAGE: true
};
// 코인 — 힌트를 사는 데 쓰며, 수업 시작 때 한 번에 지급합니다.
const COIN = {
  start: 30,     // 처음 지급하는 코인
  perPoint: 2    // 끝까지 남긴 코인 1개당 점수
};
// 점수 — 작도 결과로 쌓입니다. (필요하면 이 숫자만 고치면 됩니다)
const SCORE = {
  step1: 10, practice: 5, step2: 20, step3: 30,   // 단계별 기본 점수
  minimal: 10, nearMinimal: 5,   // 최소 횟수 / 1~2회 초과
  firstTry: 5,                   // 확인 한 번에 통과
  widthKept: 5,                  // 컴퍼스 폭을 한 번도 안 바꿈
  badge: 10,                     // 평행선을 컴퍼스 2·자 1로 해결
  second: 15                     // 평행선을 다른 계열의 방법으로 또 해결
};
const TOKEN = {};
// 힌트 한 단계를 더 볼 때 드는 코인. 각 문제의 첫 힌트는 무료입니다.
const HINT_COST = { step1:1, practice:1, step2:2, bonus:2, step3:2 };


// ===================== 기본 상수 =====================
const W = 1000, H = 640;
const EPS_LEN = 0.25, EPS_ANG = 0.2, ON_EPS = 1e-4;
const COL = { given:'#0B2545', ruler:'#1D4ED8', compass:'#0891B2', hint:'#059669' };
const PCOL = { given:'#0B2545', intersection:'#E11D48', on:'#7C3AED', free:'#94A3B8' };
const PTYPE_KO = { given:'주어진 점', intersection:'교점', on:'선 위의 점', free:'임의의 점' };
const RULER_KO = { segment:'선분', ray:'반직선', line:'직선' };

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let scale = 1, dpr = 1;
// 화면 배율 = 작도판 배율 × 사용자의 확대 배율
function zs(){ return scale * state.view.k; }

// ===================== 상태 =====================
let objs = [], M = new Map(), nextId = 1;
let actions = [], log = [], seq = 0, redoStack = [];
let problem = null, G = null, stats = null;
let busy = false, started = false;
const state = { tool:'ruler', rulerType:'segment', pending:[], snap:null, highlight:null,
                showLabels:true, width:null, skill:null, ghost:null, stage:'step1', idx:0,
                view:{ x:0, y:0, k:1 }, drag:null, measuring:false, lastTool:'ruler' };
const progress = { coins:COIN.start, score:0, skills:[], solved:{}, records:[], hints:[], submitted:0, strategies:[], skipped:{} };

// ===================== 객체 =====================
function addObj(o){ o.id = nextId++; objs.push(o); M.set(o.id, o); return o; }
function removeObj(id){ M.delete(id); objs = objs.filter(o => o.id !== id); }
function P(id){ return M.get(id); }
function gp(label, x, y, opt = {}){
  return addObj({ kind:'point', x, y, label, ptype:'given', given:true, parents:[],
                  hidden:!!opt.hidden, noLabel:!!opt.noLabel }).id;
}
function gl(p1, p2, ltype, opt = {}){
  return addObj({ kind:'line', ltype, p1, p2, parents:[p1, p2], tool:'given', given:true,
                  text:opt.text || '', textAt:opt.textAt || null }).id;
}
const LETTERS = 'ABCDEFGHJKLMNOPQRSTUVWXYZ'.split('');
function subNum(n){ return String(n).split('').map(d => '₀₁₂₃₄₅₆₇₈₉'[d]).join(''); }
function nextLabel(){
  const used = new Set(objs.filter(o => o.kind === 'point').map(o => o.label));
  for (let k = 0; k < 40; k++) for (const L of LETTERS){
    const lab = k === 0 ? L : L + subNum(k);
    if (!used.has(lab)) return lab;
  }
  return '?';
}

// ===================== 기하 =====================
function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
function tRange(t){ return t === 'segment' ? [0, 1] : t === 'ray' ? [0, Infinity] : [-Infinity, Infinity]; }
function inRange(t, type, eps = 1e-9){ const [a, b] = tRange(type); return t >= a - eps && t <= b + eps; }
function lineGeom(L){ const a = P(L.p1), b = P(L.p2); return { x:a.x, y:a.y, dx:b.x - a.x, dy:b.y - a.y, type:L.ltype }; }
function circGeom(C){ const c = P(C.center); return { x:c.x, y:c.y, r:C.r }; }
function distToLine(L, p){
  const g = lineGeom(L), len2 = g.dx * g.dx + g.dy * g.dy;
  let t = ((p.x - g.x) * g.dx + (p.y - g.y) * g.dy) / len2;
  const [a, b] = tRange(g.type); t = Math.max(a, Math.min(b, t));
  const qx = g.x + t * g.dx, qy = g.y + t * g.dy;
  return { d:Math.hypot(p.x - qx, p.y - qy), x:qx, y:qy };
}
function distToCircle(C, p){
  const g = circGeom(C), d = Math.hypot(p.x - g.x, p.y - g.y);
  if (d < 1e-9) return { d:g.r, x:g.x + g.r, y:g.y };
  return { d:Math.abs(d - g.r), x:g.x + (p.x - g.x) * g.r / d, y:g.y + (p.y - g.y) * g.r / d };
}
function distToCurve(o, p){ return o.kind === 'line' ? distToLine(o, p) : distToCircle(o, p); }
function onCurve(o, p, tol = ON_EPS){ return distToCurve(o, p).d < tol; }
function intersect(o1, o2){
  if (o1.kind === 'line' && o2.kind === 'line') return llInt(o1, o2);
  if (o1.kind === 'circle' && o2.kind === 'circle') return ccInt(o1, o2);
  return o1.kind === 'line' ? lcInt(o1, o2) : lcInt(o2, o1);
}
function llInt(A, B){
  const g = lineGeom(A), h = lineGeom(B), den = g.dx * h.dy - g.dy * h.dx;
  if (Math.abs(den) < 1e-12) return [];
  const wx = h.x - g.x, wy = h.y - g.y;
  const t = (wx * h.dy - wy * h.dx) / den, s = (wx * g.dy - wy * g.dx) / den;
  if (!inRange(t, g.type) || !inRange(s, h.type)) return [];
  return [{ x:g.x + t * g.dx, y:g.y + t * g.dy }];
}
function lcInt(L, C){
  const g = lineGeom(L), c = circGeom(C);
  const fx = g.x - c.x, fy = g.y - c.y;
  const a = g.dx * g.dx + g.dy * g.dy, b = 2 * (fx * g.dx + fy * g.dy), cc = fx * fx + fy * fy - c.r * c.r;
  let disc = b * b - 4 * a * cc;
  if (disc < -1e-9 * a) return [];
  disc = Math.max(0, disc);
  const sq = Math.sqrt(disc), ts = sq < 1e-12 ? [-b / (2 * a)] : [(-b - sq) / (2 * a), (-b + sq) / (2 * a)];
  return ts.filter(t => inRange(t, g.type)).map(t => ({ x:g.x + t * g.dx, y:g.y + t * g.dy }));
}
function ccInt(C1, C2){
  const a = circGeom(C1), b = circGeom(C2), d = Math.hypot(b.x - a.x, b.y - a.y);
  if (d < 1e-12 || d > a.r + b.r + 1e-9 || d < Math.abs(a.r - b.r) - 1e-9) return [];
  const l = (a.r * a.r - b.r * b.r + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, a.r * a.r - l * l));
  const mx = a.x + l * (b.x - a.x) / d, my = a.y + l * (b.y - a.y) / d;
  if (h < 1e-9) return [{ x:mx, y:my }];
  return [{ x:mx + h * (b.y - a.y) / d, y:my - h * (b.x - a.x) / d },
          { x:mx - h * (b.y - a.y) / d, y:my + h * (b.x - a.x) / d }];
}
// 좌표만으로 교점을 구하는 보조 함수 (힌트의 표준 해법을 그릴 때 씁니다)
function unitV(a, b){ const n = Math.hypot(b.x-a.x, b.y-a.y) || 1; return { x:(b.x-a.x)/n, y:(b.y-a.y)/n }; }
function movePt(a, u, t){ return { x:a.x + t*u.x, y:a.y + t*u.y }; }
function cc2(a, ra, b, rb){            // 원 + 원
  const d = Math.hypot(b.x-a.x, b.y-a.y);
  if (d < 1e-9 || d > ra+rb || d < Math.abs(ra-rb)) return [];
  const l = (ra*ra - rb*rb + d*d)/(2*d), h = Math.sqrt(Math.max(0, ra*ra - l*l));
  const mx = a.x + l*(b.x-a.x)/d, my = a.y + l*(b.y-a.y)/d;
  return [{ x:mx + h*(b.y-a.y)/d, y:my - h*(b.x-a.x)/d },
          { x:mx - h*(b.y-a.y)/d, y:my + h*(b.x-a.x)/d }];
}
function lc2(A, u, c, r){              // 직선 + 원 (u 는 단위벡터)
  const fx = A.x - c.x, fy = A.y - c.y;
  const b = 2*(fx*u.x + fy*u.y), k = fx*fx + fy*fy - r*r, disc = b*b - 4*k;
  if (disc < 0) return [];
  const sq = Math.sqrt(disc);
  return [movePt(A, u, (-b-sq)/2), movePt(A, u, (-b+sq)/2)];
}
function ll2(g1, g2){                    // 직선 + 직선 (a, u 로 주어진 두 직선)
  const den = g1.u.x*g2.u.y - g1.u.y*g2.u.x;
  if (Math.abs(den) < 1e-12) return [];
  const wx = g2.a.x - g1.a.x, wy = g2.a.y - g1.a.y;
  const t = (wx*g2.u.y - wy*g2.u.x) / den;
  return [{ x:g1.a.x + t*g1.u.x, y:g1.a.y + t*g1.u.y }];
}
function inSpan(g, p){                   // 선분·반직선의 범위 안에 있는가
  if (g.t !== 'l') return true;
  const t = (p.x - g.a.x)*g.u.x + (p.y - g.a.y)*g.u.y;
  if (g.type === 'ray') return t > -1e-6;
  if (g.type === 'segment'){
    const len = Math.hypot(g.b.x - g.a.x, g.b.y - g.a.y);
    return t > -1e-6 && t < len + 1e-6;
  }
  return true;
}

function rhombusSteps(lObj, Pp){
  const { A:la, u } = lineAxis(lObj), h = distToLine(lObj, Pp).d, r = Math.max(h*1.1, h + 25);
  for (const sgn of [1, -1]){
    const hits = lc2(la, u, Pp, r);

    const A1 = sgn > 0 ? farFrom(hits, movePt(la, u, -9000)) : farFrom(hits, movePt(la, u, 9000));
    const B1 = movePt(A1, u, sgn * r);

function angleAt(o, p, q){
  let d = Math.abs(Math.atan2(p.y - o.y, p.x - o.x) - Math.atan2(q.y - o.y, q.x - o.x));

}

}

function snapCandidate(p){
  // 끌어다 맞추는 범위는 작도판 기준으로 고정합니다.
  // (축소해서 볼 때 범위가 같이 넓어지면 아무 데나 눌러도 교점에 붙어 버립니다)
  const z = Math.max(zs(), scale);
  const tp = 14 / z, tc = 10 / z;
  let pt = null, pd = tp;
  for (const o of objs){
    if (o.kind !== 'point' || o.hidden) continue;
    const d = dist(o, p); if (d < pd){ pd = d; pt = o; }
  }
  let it = null, idd = tp;
  const near = objs.filter(o => o.kind !== 'point' && distToCurve(o, p).d < tp * 1.5);
  for (let i = 0; i < near.length; i++) for (let j = i + 1; j < near.length; j++)
    for (const q of intersect(near[i], near[j])){
      const d = dist(q, p);
      if (d < idd){ idd = d; it = { x:q.x, y:q.y, parents:[near[i].id, near[j].id] }; }
    }
  if (pt && (!it || pd <= idd + 3 / zs())) return { type:'existing', point:pt, x:pt.x, y:pt.y };
  if (it){
    for (const o of objs) if (o.kind === 'point' && !o.hidden && dist(o, it) < 1e-6)
      return { type:'existing', point:o, x:o.x, y:o.y };
    return { type:'intersection', x:it.x, y:it.y, parents:it.parents };
  }
  let cc = null, cd = tc;
  for (const o of objs){
    if (o.kind === 'point') continue;
    const r = distToCurve(o, p);
    if (r.d < cd){ cd = r.d; cc = { type:'on', x:r.x, y:r.y, parents:[o.id] }; }
  }
  return cc || { type:'free', x:p.x, y:p.y, parents:[] };
}
function materialize(c, created){
  if (c.type === 'existing') return c.point;
  for (const id of created){ const o = P(id); if (o && o.kind === 'point' && dist(o, c) < 1e-6) return o; }
  const o = addObj({ kind:'point', x:c.x, y:c.y, ptype:c.type, parents:(c.parents || []).slice(), label:nextLabel() });
  created.push(o.id);
  return o;
}
function mkPoint(x, y, parents, created, ptype){
  for (const o of objs) if (o.kind === 'point' && dist(o, { x, y }) < 1e-6) return o;
  const o = addObj({ kind:'point', x, y, ptype:ptype || 'intersection', parents:parents.slice(), label:nextLabel() });
  if (created) created.push(o.id);
  return o;
}
function newPtsText(created){
  const pts = created.map(P).filter(o => o && o.kind === 'point');
  return pts.length ? ` (새 점 ${pts.map(o => o.label).join(', ')})` : '';
}
function pickLine(p){
  let best = null, bd = 12 / zs();
  for (const o of objs){
    if (o.kind !== 'line') continue;
    const d = distToCurve(o, p).d;
    if (d < bd){ bd = d; best = o; }
  }
  return best;
}

// 어떤 계열의 방법을 썼는지 자동 분류
function classify(ansIds, g){
  const anc = ancestors(ansIds), l = P(g.l);
  const inSet = [...anc].map(P).filter(Boolean);
  const sk = new Set(actions.filter(a => a.skillId && a.ids.some(id => anc.has(id))).map(a => a.skillId));
  if (sk.has('angle')) return '각 이용 (각 옮기기)';
  if (sk.has('perpdown') || sk.has('perpup')) return '각 이용 (수선 두 번)';
  if (sk.has('mid') || sk.has('sym') || sk.has('diam')) return '삼각형·원 이용 (중점·점대칭)';
  if (sk.has('copy')) return '사각형 이용 (같은 길이 옮기기)';
  const lines = inSet.filter(o => o.kind === 'line' && !o.given);
  if (lines.some(L => perpTo(l, P(L.p1), P(L.p2)))) return '각 이용 (수선 두 번)';
  const pts = inSet.filter(o => o.kind === 'point');
  for (const m of pts) for (const a of pts) for (const b of pts){
    if (m === a || m === b || a === b) continue;
    if (Math.abs(dist(a,m) - dist(b,m)) < 0.3 && Math.abs(dist(a,m) + dist(b,m) - dist(a,b)) < 0.3)
      return '삼각형·원 이용 (중점·점대칭)';
  }
  const rs = inSet.filter(o => o.kind === 'circle').map(o => o.r).sort((x,y) => x-y);
  let run = 1, best = 1;
  for (let i = 1; i < rs.length; i++){ if (Math.abs(rs[i]-rs[i-1]) < 0.5){ run++; best = Math.max(best, run); } else run = 1; }
  if (best >= 2) return '사각형 이용 (같은 반지름 원)';
  return '각 이용 (각 옮기기)';
}

           '선분 OP의 중점 M을 찾아 OP를 지름으로 하는 보조원을 그려 보세요. 두 원의 교점이 접점입니다. 접점도 점으로 찍어 두어야 합니다.'],
    setup(){
      const O = gp('O',360,360), Pp = gp('P',830,250);
      const rim = gp('',360+170,360,{hidden:true});
      addObj({ kind:'circle', center:O, r:170, parents:[O,rim], tool:'given', given:true });
      return { O, P:Pp, r:170 };
    },
    solve(g){
      const O = P(g.O), Pp = P(g.P), Mc = { x:(O.x+Pp.x)/2, y:(O.y+Pp.y)/2 }, rm = dist(O,Pp)/2;
      const T = topMost(cc2(O, g.r, Mc, rm));
      const steps = [{ k:'line', a:O, b:Pp, ltype:'segment' }, { k:'circle', c:Mc, r:rm }];
      if (T) steps.push({ k:'line', a:Pp, b:T, ltype:'line' });
      return steps; },
    check(g){
      const O = P(g.O), Pp = P(g.P);
      for (const L of rulerLines()){
        if (!drawnLine(L) || !through(L, Pp)) continue;
        const h = lineGeom(L), n = Math.hypot(h.dx, h.dy);
        const d = Math.abs(h.dx*(O.y - h.y) - h.dy*(O.x - h.x)) / n;
        if (Math.abs(d - g.r) > 0.2) continue;
        // 접점도 작도로 얻은 점이어야 합니다 (눈대중으로 원에 닿게 그은 선은 인정하지 않습니다)
        const T = cpts().find(q => Math.abs(dist(q, O) - g.r) < 0.3 && through(L, q));
        if (T) return { ok:true, ids:[L.id, T.id], msg:`점 P에서 원 O에 그은 접선을 작도했습니다. (접점 ${T.label})` };
      }
      return { ok:false, msg:'점 P를 지나면서 원에 꼭 한 점에서 닿는 직선을 아직 찾지 못했어요. 접점도 작도로 얻은 교점이어야 합니다.' };
    } },
  { id:'E2', title:'선분의 3등분', score:SCORE.step3,
    desc:'선분 AB를 세 등분하는 두 점을 작도하세요.',
    hints:['점 A에서 비스듬한 반직선을 긋고, 같은 길이를 세 번 옮겨 보세요.',
           '반직선 위의 세 번째 점과 B를 이은 선분을 긋고, 첫 번째·두 번째 점에서 그 선분에 평행한 직선을 각각 그으면 선분 AB가 3등분됩니다.'],
    setup(){ const A = gp('A',220,430), B = gp('B',820,430); gl(A,B,'segment'); return { A,B }; },
    solve(g){
      const A = P(g.A), B = P(g.B), u = unitV(A, { x:A.x+400, y:A.y-270 }), e = 160;
      const A1 = movePt(A, u, e), A2 = movePt(A, u, 2*e), A3 = movePt(A, u, 3*e);
      const t1 = { x:A.x + (B.x-A.x)/3, y:A.y + (B.y-A.y)/3 };
      const t2 = { x:A.x + 2*(B.x-A.x)/3, y:A.y + 2*(B.y-A.y)/3 };
      return [{ k:'line', a:A, b:A3, ltype:'segment' },
              { k:'circle', c:A, r:e }, { k:'circle', c:A1, r:e }, { k:'circle', c:A2, r:e },
              { k:'line', a:A3, b:B, ltype:'segment' },
              { k:'line', a:A2, b:t2, ltype:'segment' },
              { k:'line', a:A1, b:t1, ltype:'segment' }]; },
    check(g){
      const A = P(g.A), B = P(g.B), d = dist(A,B);
      const on = cpts().filter(p => Math.abs(dist(A,p) + dist(p,B) - d) < 0.35);
      let x = null, y = null;
      for (const p of on){
        if (Math.abs(dist(A,p) - d/3) < 0.45) x = p;
        if (Math.abs(dist(A,p) - 2*d/3) < 0.45) y = p;
      }
      if (x && y) return { ok:true, ids:[x.id,y.id], msg:`점 ${x.label}, ${y.label}가 선분 AB를 삼등분합니다.` };
      return { ok:false, msg: on.length ? '선분 위의 점은 찾았지만 아직 3등분 위치가 아닙니다.' : '선분 AB 위에 작도로 얻은 점이 아직 없습니다.' };
    } }
];

function stepHints(pr){
  const h = STEP_HINTS[pr && pr.id];
  if (h) return h;
  return ((pr && pr.hints) || ['이 문제는 앞에서 배운 작도를 조합하면 됩니다.']).map(t => ({ t }));
}

const STAGES = { step1:STEP1, practice:PRACTICE, step2:STEP2, bonus:BONUS, step3:STEP3 };
// 단계 열림 조건: 평행선은 기본 작도 8개를 모두 풀면, 보너스·도전은 평행선을 풀면 열립니다.
function stageOpen(st){
  if (!CONFIG.LOCK_STAGES) return true;
  if (st === 'step1' || st === 'practice') return true;
  const step1Done = STEP1.every(p => progress.solved[p.id]);
  if (st === 'step2') return step1Done;
  return step1Done && STEP2.every(p => progress.solved[p.id]);
}
function stageNeed(st){
  return st === 'step2' ? '1. 기본 작도 8개를 모두 풀면 열립니다.' : '2. 평행선 작도를 풀면 열립니다.';
}
function problems(){ return STAGES[state.stage] || STEP1; }

// ===================== 작도 기록 =====================
function elapsed(){ return Math.round((Date.now() - stats.start) / 100) / 10; }
function commit(kind, detail, ids, cost){
  redoStack = [];                 // 새로 작도하면 앞으로 갈 자리는 없어집니다
  const s = ++seq;
  actions.push({ seq:s, ids:ids.slice(), ruler:cost.ruler || 0, compass:cost.compass || 0, kind });
  log.push({ seq:s, t:elapsed(), kind, detail, ids:ids.slice() });
  state.highlight = null; hideMsg(); warnOutside();
}
function addLog(kind, detail){ log.push({ seq:++seq, t:elapsed(), kind, detail }); }
function liveActions(){ return actions; }
function limitLeft(kind){
  const lim = problem && problem.limit; if (!lim) return Infinity;
  const t = totals();
  if (kind === 'ruler' && lim.ruler != null) return lim.ruler - t.ruler;
  if (kind === 'compass' && lim.compass != null) return lim.compass - t.compass;
  return Infinity;
}
function blockedBy(kind, need){
  if (limitLeft(kind) >= (need || 1)) return false;
  const lim = problem.limit;
  flashHint(kind === 'ruler' ? `이 문제에서는 자를 ${lim.ruler}번만 쓸 수 있습니다.`
                             : `이 문제에서는 컴퍼스를 ${lim.compass}번만 쓸 수 있습니다.`);
  state.pending = []; refresh(); return true;
}
function totals(){
  let r = 0, c = 0;
  for (const a of actions){ r += a.ruler; c += a.compass; }
  return { ruler:r, compass:c };
}
function ancestors(ids){
  const S = new Set(), st = [...ids];
  while (st.length){
    const id = st.pop(); if (S.has(id)) continue;
    const o = P(id); if (!o) continue;
    S.add(id); o.parents.forEach(p => st.push(p));
  }
  return S;
}
function meaningfulCount(ansIds){
  const anc = ancestors(ansIds);
  let r = 0, c = 0; const used = [];
  for (const a of actions){
    if (a.ids.some(id => anc.has(id))){ r += a.ruler; c += a.compass; used.push(a.seq); }
  }
  return { ruler:r, compass:c, total:r + c, used:new Set(used) };
}

// ===================== 입력 =====================
function handleClick(p){
  if (busy || (state.tool === 'pan' && !state.skill)) return;
  if (!started){ flashHint('먼저 학번과 이름을 입력하고 [시작]을 누르세요.'); return; }
  if (state.skill){ skillClick(p); return; }
  const c = snapCandidate(p), t = state.tool;
  if (t === 'point'){
    if (c.type === 'existing'){ flashHint('이미 있는 점입니다.'); return; }
    const created = [], pt = materialize(c, created);
    commit('point', `점 ${pt.label} 찍기 (${PTYPE_KO[pt.ptype]})`, created, {});
    refresh(); return;
  }
  if (t === 'transfer' && !state.width && !state.pending.length && !state.measuring){
    // 점(기존 점·교점)을 눌렀으면 길이를 재려는 것이므로 원을 가져오지 않습니다
    const onPoint = c.type === 'existing' || c.type === 'intersection';
    const z = Math.max(zs(), scale);
    const near = onPoint ? [] : objs.filter(o => o.kind === 'circle' && distToCircle(o, p).d < 10 / z);
    if (near.length){
      const cc = near.sort((a, b) => distToCircle(a, p).d - distToCircle(b, p).d)[0];
      setWidth(cc.r, '원 ' + P(cc.center).label, [cc.center]);
      flashHint('원의 반지름을 폭으로 가져왔습니다. 이제 중심을 찍으세요.');
      refresh(); return;
    }
  }
  if (t === 'transfer' && state.width){
    const created = [], o = materialize(c, created);
    const C = addObj({ kind:'circle', center:o.id, r:state.width.r, parents:[o.id, ...state.width.src], tool:'compass' });
    created.push(C.id);
    const extra0 = state.widthCost || 0;
    if (blockedBy('compass', 1 + extra0)){ removeObj(C.id); created.filter(i => i !== C.id).forEach(removeObj); return; }
    const extra = extra0; state.widthCost = 0;
    commit('compass', `고정된 폭(${state.width.name})으로 ${o.label}에 원 그리기${extra ? ' [길이 재기 포함]' : ''}${newPtsText(created.filter(i => i !== C.id))}`, created, { compass:1 + extra });
    refresh(); return;
  }
  if (state.pending.some(q => dist(q, c) < 1e-6)){ flashHint('서로 다른 점을 선택하세요.'); return; }
  state.pending.push(c);
  if (t === 'ruler' && state.pending.length === 2){
    if (blockedBy('ruler')) return;
    const created = [], a = materialize(state.pending[0], created), b = materialize(state.pending[1], created);
    const L = addObj({ kind:'line', ltype:state.rulerType, p1:a.id, p2:b.id, parents:[a.id,b.id], tool:'ruler' });
    created.push(L.id);
    commit('ruler', `${RULER_KO[state.rulerType]} ${a.label}${b.label} 긋기${newPtsText(created.filter(i => i !== L.id))}`, created, { ruler:1 });
    state.pending = [];
  } else if (t === 'compass' && state.pending.length === 2){
    if (blockedBy('compass')) return;
    const created = [], o = materialize(state.pending[0], created), q = materialize(state.pending[1], created);
    const C = addObj({ kind:'circle', center:o.id, r:dist(o,q), parents:[o.id,q.id], tool:'compass' });
    created.push(C.id);
    setWidth(dist(o,q), `${o.label}${q.label}`, [o.id,q.id]);
    commit('compass', `중심 ${o.label}, 반지름 ${o.label}${q.label} 인 원${newPtsText(created.filter(i => i !== C.id))}`, created, { compass:1 });
    state.pending = [];
  } else if (t === 'transfer' && state.pending.length === 2){
    const created = [], a = materialize(state.pending[0], created), b = materialize(state.pending[1], created);
    setWidth(dist(a,b), `${a.label}${b.label}`, [a.id,b.id], true);
    state.pending = [];
    flashHint(`폭을 ${a.label}${b.label} 로 맞췄습니다. 이제 중심을 찍으세요. (같은 폭으로 여러 번 그릴 수 있습니다)`);
  }
  refresh();
}
function setWidth(r, name, src, fromMeasure){
  state.measuring = false;
  const changed = !state.width || Math.abs(state.width.r - r) > 1e-9;
  if (changed){
    stats.widthChanges++; state.width = { r, name, src };
    if (fromMeasure && CONFIG.COUNT_WIDTH_AS_COMPASS) state.widthCost = 1;
  }
  updateWidthBox();
}
function skillClick(p){
  const s = skill(state.skill), need = s.need[state.pending.length];
  if (problem.limit && problem.limit.skills === false){ flashHint('이 문제에서는 스킬을 쓸 수 없습니다.'); state.skill = null; renderSkills(); refresh(); return; }
  if (need === 'l'){
    const L = pickLine(p);
    if (!L){ flashHint('직선을 눌러 선택하세요.'); return; }
    state.pending.push({ type:'line', obj:L, x:p.x, y:p.y });
  } else {
    const c = snapCandidate(p);
    state.pending.push(c);
  }
  if (state.pending.length === s.need.length) runSkill(s);
  refresh();
}
function runSkill(s){
  const created = [], args = [];
  for (let i = 0; i < s.need.length; i++){
    const it = state.pending[i];
    args.push(s.need[i] === 'l' ? it.obj : materialize(it, created));
  }
  state.pending = [];
  if (blockedBy('ruler', s.cost.ruler) || blockedBy('compass', s.cost.compass)){ created.forEach(removeObj); return; }
  let steps;
  try { steps = s.run(args); } catch (e){ flashHint('이 위치에서는 사용할 수 없어요.'); refresh(); return; }
  busy = true;
  const madeIds = created.slice(), parentsBase = args.map(a => a.id);
  let last = null, i = 0;
  const tick = () => {
    if (i >= steps.length){
      busy = false;
      commit('skill', `[스킬] ${s.name} 사용 → 자 ${s.cost.ruler}, 컴퍼스 ${s.cost.compass} 환산${newPtsText(madeIds.filter(id => P(id) && P(id).kind === 'point'))}`,
             madeIds, { ruler:s.cost.ruler, compass:s.cost.compass });
      actions[actions.length - 1].skillId = s.id;
      refresh(); return;
    }
    const st = steps[i++], par = (st.parents || parentsBase).concat(st.useLast && last ? [last] : []);
    if (st.k === 'point'){
      const pt = mkPoint(st.x, st.y, par, madeIds, 'intersection');
      last = pt.id;
    } else if (st.k === 'circle'){
      const c = mkPoint(st.cx, st.cy, par, madeIds, 'intersection');
      const C = addObj({ kind:'circle', center:c.id, r:st.r, parents:par.concat([c.id]), tool:'skill' });
      madeIds.push(C.id); last = C.id;
    } else if (st.k === 'line'){
      const a = mkPoint(st.ax, st.ay, par, madeIds, 'intersection');
      const b = mkPoint(st.bx, st.by, par, madeIds, 'intersection');
      const L = addObj({ kind:'line', ltype:st.ltype, p1:a.id, p2:b.id, parents:par.concat([a.id,b.id]), tool:'skill' });
      madeIds.push(L.id); last = L.id;
    }
    draw();
    setTimeout(tick, 260);
  };
  tick();
}
function undo(){
  if (busy) return;
  if (state.pending.length){ state.pending = []; refresh(); return; }
  const a = actions.pop();
  if (!a){ flashHint('되돌릴 작도가 없어요.'); return; }
  const kept = a.ids.map(id => P(id)).filter(Boolean);   // 앞으로 가기를 위해 그대로 보관합니다
  a.ids.forEach(removeObj);
  const le = log.find(l => l.seq === a.seq); if (le) le.removedBy = '되돌림';
  redoStack.push({ action:a, objects:kept });
  stats.undo++; addLog('undo', '되돌리기');
  state.highlight = null; hideMsg(); refresh();
}
// 되돌린 작도를 다시 살립니다. 새로 작도하면 앞으로 갈 자리는 사라집니다.
function redo(){
  if (busy) return;
  const r = redoStack.pop();
  if (!r){ flashHint('앞으로 갈 작도가 없어요.'); return; }
  r.objects.forEach(o => { if (!M.has(o.id)){ objs.push(o); M.set(o.id, o); } });
  objs.sort((x, y) => x.id - y.id);
  actions.push(r.action);
  const le = log.find(l => l.seq === r.action.seq); if (le) le.removedBy = null;
  stats.redo++; addLog('redo', '앞으로 가기');
  state.pending = []; state.highlight = null; hideMsg(); refresh();
}
async function resetWork(){
  if (busy) return;
  if (!actions.length && !state.pending.length) return;
  if (!(await askConfirm('이 문제의 작도를 모두 지울까요?'))) return;
  state.pending = [];
  actions.forEach(a => { a.ids.forEach(removeObj); const le = log.find(l => l.seq === a.seq); if (le && !le.removedBy) le.removedBy = '처음부터'; });
  actions = []; redoStack = []; stats.reset++; stats.widthChanges = 0; addLog('reset', '처음부터');
  state.width = null; state.widthCost = 0; state.measuring = false; state.highlight = null; hideMsg(); refresh();
}

// ===================== 채점과 점수 =====================
// 표준 해법으로 풀 때 드는 작도 횟수 (자 + 컴퍼스, 폭 설정은 세지 않음)
// 스킬을 쓰면 그 스킬의 환산 횟수로 계산되므로 기준은 같습니다.
function standardCost(pr){
  const m = { A1:1, A2:4, A3:3, A4:3, A5:4, A6:2, A7:4, A8:4,   // 기본 작도
              B1:4, B2:6, B3:7, B4:9,                            // 연습 문제
              C1:4, D1:4, D2:7,                                  // 평행선 · 심화
              E1:5, E2:13 };                                     // 도전
  return m[pr.id] || 4;
}
function finalScore(){ return progress.score + progress.coins * COIN.perPoint; }
function baseScore(){
  if (problem.score) return problem.score;
  return state.stage === 'practice' ? SCORE.practice : state.stage === 'step1' ? SCORE.step1 : SCORE.step2;
}
function onCheck(){
  if (busy) return;
  stats.check++;
  const r = problem.check(G);
  addLog('check', r.ok ? '작도 확인: 성공' : '작도 확인: 미완성');
  if (!r.ok){ showMsg(r.msg, 'warn'); refresh(); return; }

  const mc = meaningfulCount(r.ids), tot = totals();
  state.highlight = ancestors(r.ids);
  const strat = problem.strategy ? classify(r.ids, G) : '';
  const already = !!progress.solved[problem.id];
  let gained = 0, why = [], secondOk = false;

  if (already && problem.strategy && strat && !progress.strategies.includes(strat)){
    secondOk = true;
    gained += SCORE.second; why.push(`다른 계열의 방법 +${SCORE.second}`);
    progress.strategies.push(strat);
  }
  if (!already){
    const base = baseScore();
    gained += base; why.push(`성공 +${base}`);
    const min = standardCost(problem), used = mc.total;
    if (used <= min){ gained += SCORE.minimal; why.push(`표준 해법 이하 +${SCORE.minimal}`); }
    else if (used <= min + 2){ gained += SCORE.nearMinimal; why.push(`표준 해법 +2회 안 +${SCORE.nearMinimal}`); }
    if (stats.check === 1){ gained += SCORE.firstTry; why.push(`한 번에 통과 +${SCORE.firstTry}`); }
    if (stats.widthChanges <= 1 && tot.compass >= 2){ gained += SCORE.widthKept; why.push(`폭 유지 +${SCORE.widthKept}`); }
    if (problem.strategy && mc.compass <= 2 && mc.ruler <= 1){ gained += SCORE.badge; why.push(`최소 작도 배지 +${SCORE.badge}`); }
    if (strat && !progress.strategies.includes(strat)) progress.strategies.push(strat);
    progress.solved[problem.id] = true;
    if (problem.skill && !hasSkill(problem.skill)) progress.skills.push(problem.skill);
  }
  if (gained){
    progress.score += gained;
    progress.records.push({
      id:already ? problem.id + '-2' : problem.id,
      title:already ? problem.title + ' (다른 방법)' : problem.title,
      stage:state.stage, solved:'O', sec:elapsed(),
      ruler:tot.ruler, compass:tot.compass, rulerM:mc.ruler, compassM:mc.compass,
      rulerX:tot.ruler - mc.ruler, compassX:tot.compass - mc.compass,
      width:stats.widthChanges, undo:stats.undo, reset:stats.reset, check:stats.check,
      hints:stats.hintsUsed.map(l => l + 1).join(','), score:gained, strategy:strat
    });
  }

  let txt = '🎉 ' + r.msg;
  if (strat) txt += `<br>사용한 방법: <b>${strat}</b>`;
  txt += `<br>정답에 쓰인 작도: 자 <b>${mc.ruler}</b>, 컴퍼스 <b>${mc.compass}</b> (합계 ${mc.total}회 · 이 문제의 표준 해법은 ${standardCost(problem)}회)`;
  const ur = tot.ruler - mc.ruler, uc = tot.compass - mc.compass;
  if (ur + uc > 0) txt += ` · 쓰이지 않은 작도: 자 ${ur}, 컴퍼스 ${uc} (흐리게 표시)`;
  if (gained){
    txt += `<br>◆ <b>+${gained}점</b> (${why.join(' · ')})`;
    if (problem.skill && !already) txt += `<br>✨ <b>${skill(problem.skill).name}</b> 스킬을 얻었습니다.`;
    txt += `<br>지금까지 <b>${progress.score}점</b> · 남은 코인 ${progress.coins}개(${progress.coins * COIN.perPoint}점) → 합계 <b>${finalScore()}점</b>`;
  } else {
    txt += '<br>이미 점수를 받은 문제입니다.';
  }
  const ps = problems();
  if (state.idx < ps.length - 1) txt += `<br><button class="btn" id="btnNext" style="margin-top:9px;width:100%">다음 문제로 →</button>`;
  showMsg(txt, 'ok');
  const nb = document.getElementById('btnNext');
  if (nb) nb.onclick = () => loadProblem(state.idx + 1);
  if (!already && problems().every(p => progress.solved[p.id])) submit(true);
  renderAll(); draw();
}
function nextIndex(){
  const ps = problems();
  for (let i = 0; i < ps.length; i++) if (!progress.solved[ps[i].id]) return i;
  return -1;
}

// ===================== 힌트 =====================
// 문제마다 작도 단계 수만큼 힌트가 있습니다. 첫 힌트는 무료, 그다음부터 한 단계씩 코인을 씁니다.
function hintCost(lv){ return lv === 0 ? 0 : (HINT_COST[state.stage] || 1); }
function hintCount(){ return stepHints(problem).length; }
function nextHintLv(){
  const n = hintCount();
  for (let lv = 0; lv < n; lv++) if (!stats.hintsUsed.includes(lv)) return lv;
  return -1;
}
function useHint(lv){
  if (busy) return;
  if (lv < 0 || lv >= hintCount()) return;
  if (stats.hintsUsed.includes(lv)){ showHint(lv); return; }
  if (lv > 0 && !stats.hintsUsed.includes(lv - 1)){
    flashHint('앞 단계 힌트를 먼저 보세요.'); return; }
  const cost = hintCost(lv);
  if (progress.coins < cost){
    showMsg(`힌트코인이 모자랍니다. (필요 ●×${cost} · 남은 것 ●×${progress.coins})`, 'warn'); return; }
  progress.coins -= cost;
  stats.hintsUsed.push(lv);
  progress.hints.push({ id:problem.id, lv, t:elapsed(), cost });
  addLog('hint', `힌트 ${lv + 1}단계 사용 (코인 ${cost}개)`);
  if (cost) flashHint(`힌트코인 ●×${cost} 를 썼습니다. 남은 것 ●×${progress.coins}`);
  showHint(lv); renderAll();
}
let ghostTimer = null;
// 이 단계를 그리면 새로 생기는 교점 — '여기를 찍으세요' 표시로 씁니다
function ghostPoints(idx, steps){
  const cur = stepGeom(steps[idx]);
  if (!cur) return [];
  // 학생이 실제로 누를 수 있는 곳이 먼저입니다.
  // ① 학생이 그린 것과 만나는 점 ② 주어진 도형과 만나는 점 ③ 표준 해법의 앞 단계와 만나는 점
  const ranked = [];
  for (const o of objs) if (o.kind !== 'point' && !o.given) ranked.push(objGeom(o));
  for (const o of objs) if (o.kind !== 'point' && o.given) ranked.push(objGeom(o));
  if (idx > 0) ranked.push(stepGeom(steps[idx - 1]));
  const vs = viewSize(), v = state.view, k = v.k;
  const x0 = (-v.x)/k, y0 = (-v.y)/k;
  const out = [];
  for (const g of ranked){
    for (const q of geomInt(cur, g)){
      if (!isFinite(q.x) || !isFinite(q.y)) continue;
      if (q.x < x0 - 20 || q.x > x0 + vs.w/k + 20 || q.y < y0 - 20 || q.y > y0 + vs.h/k + 20) continue;
      if (out.some(w => dist(w, q) < 1.5)) continue;
      if (objs.some(o => o.kind === 'point' && !o.hidden && dist(o, q) < 1.5)) continue;
      out.push(q);
      if (out.length >= 3) return out;
    }
  }
  return out;
}
// 그 단계에서 그릴 것을 점선으로, 새로 생기는 점을 반투명 동그라미로 보여 줍니다
function drawGhostHint(lv){
  const list = stepHints(problem), h = list[lv];
  if (!h) return false;
  const steps = problem.solve ? problem.solve(G) : [];
  let ghost = null;
  if (h.g != null && steps[h.g]){
    ghost = [steps[h.g]].concat(ghostPoints(h.g, steps).map(q => ({ k:'point', x:q.x, y:q.y })));
  } else if (/찍/.test(h.t) && lv > 0 && list[lv-1].g != null && steps[list[lv-1].g]){
    // 앞 단계에서 그린 것 위에 '찍을 자리'만 보여 줍니다
    const pts = ghostPoints(list[lv-1].g, steps);
    if (pts.length) ghost = pts.map(q => ({ k:'point', x:q.x, y:q.y }));
  }
  if (!ghost || !ghost.length) return false;
  state.ghost = ghost;
  draw();
  clearTimeout(ghostTimer);
  ghostTimer = setTimeout(() => { state.ghost = null; draw(); }, 7000);
  return true;
}
function closeHint(){
  const pane = document.getElementById('hintPane');
  pane.classList.remove('show'); pane.innerHTML = '';
  clearTimeout(ghostTimer); state.ghost = null; draw();
  renderHints();
}
function showHint(lv){
  const list = stepHints(problem), n = list.length;
  lv = Math.max(0, Math.min(n - 1, lv));
  state.hintAt = lv;
  const pane = document.getElementById('hintPane');
  const drew = drawGhostHint(lv);
  const nx = lv + 1, bought = stats.hintsUsed.includes(nx), cost = hintCost(nx);
  pane.innerHTML =
    `<div class="hd"><span>💡</span><b>힌트 ${lv+1} / ${n}</b>` +
    `<button class="x" id="btnHintClose" title="힌트 닫기">✕</button></div>` +
    `<div class="bd">${list[lv].t}</div>` +
    `<div class="hnav">` +
      `<button class="nb" id="hPrev"${lv === 0 ? ' disabled' : ''}>← 이전 힌트</button>` +
      `<button class="nb${nx < n && !bought ? ' buy' : ''}" id="hNext"${nx >= n ? ' disabled' : ''}>` +
        (nx >= n ? '마지막 힌트' : `다음 힌트 →${!bought && cost ? ` <span class="c">●×${cost}</span>` : ''}`) +
      `</button>` +
    `</div>` +
    (drew ? `<button class="re" id="btnGhostAgain">점선 다시 보기</button>` : '');
  pane.classList.add('show');
  document.getElementById('btnHintClose').onclick = closeHint;
  document.getElementById('hPrev').onclick = () => showHint(lv - 1);
  document.getElementById('hNext').onclick = () => (bought ? showHint(nx) : useHint(nx));
  const rb = document.getElementById('btnGhostAgain');
  if (rb) rb.onclick = () => drawGhostHint(lv);
  renderHints();
}
function alreadyDone(st){
  if (st.k === 'circle')
    return objs.some(o => o.kind === 'circle' && Math.abs(o.r - st.r) < 1 && dist(P(o.center), st.c) < 1);
  if (st.k === 'line')
    return objs.some(o => o.kind === 'line' && !o.given && onCurve(o, st.a, 1) && onCurve(o, st.b, 1));
  return false;
}

function buildPayload(auto){
  const tot = totals();
  return {
    submissionId:'S' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    clientTime:new Date().toLocaleString('ko-KR'),
    studentId:document.getElementById('sid').value.trim(),
    name:document.getElementById('sname').value.trim(),
    stage:state.stage === 'step1' ? 'Step 1' : '연습 문제',
    auto:auto ? '자동' : '수동',
    score:progress.score,
    coins:progress.coins,
    coinBonus:progress.coins * COIN.perPoint,
    finalScore:finalScore(),
    skills:progress.skills.map(id => skill(id).name).join(', '),
    solvedCount:progress.records.length,
    strategies:progress.strategies.join(' / '),
    totalSec:Math.round((Date.now() - progress.startAll) / 100) / 10,
    records:progress.records,
    hints:progress.hints,
    log:log.map(l => ({ seq:l.seq, t:l.t, kind:l.kind, detail:l.detail, status:l.removedBy || '' })),
    problemId:problem ? problem.id : '',
    image:CONFIG.SEND_IMAGE ? exportImage(null) : ''
  };
}
async function submit(auto){
  const sid = document.getElementById('sid').value.trim(), nm = document.getElementById('sname').value.trim();
  if (!sid || !nm){ if (!auto) showMsg('학번과 이름을 먼저 입력하세요.', 'warn'); return; }
  if (!progress.records.length){ if (!auto) showMsg('아직 제출할 기록이 없습니다.', 'warn'); return; }
  const payload = buildPayload(auto);
  if (!/^https:\/\/script\.google\.com\//.test(CONFIG.SCRIPT_URL)){
    showMsg('선생님 설정 필요: SCRIPT_URL이 비어 있습니다.', 'err'); return; }
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true; if (!auto) showMsg('제출 중입니다…', 'info');
  const r = await sendData(payload);
  btn.disabled = false;
  if (r.ok){ progress.submitted++; showMsg(`✅ 제출 완료 — 문제 ${payload.solvedCount}개 · 작도 점수 ${payload.score} + 코인 ${payload.coins}개(${payload.coinBonus}점) = <b>${payload.finalScore}점</b>`, 'ok'); }
  else { showMsg('제출에 실패했습니다. 다시 눌러 주세요.<br><small>' + r.reason + '</small>', 'err'); downloadBackup(payload); }
}
async function sendData(payload){
  const body = JSON.stringify(payload);
  let res;
  try { res = await fetch(CONFIG.SCRIPT_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body, redirect:'follow' }); }
  catch (e){ console.error(e); return { ok:false, reason:'서버에 연결하지 못했습니다. (웹 앱 액세스 권한 확인)' }; }
  const text = await res.text();
  let j = null; try { j = JSON.parse(text); } catch (e){}
  if (!j){ console.error('non-JSON', res.status, text.slice(0,300)); return { ok:false, reason:'서버 응답이 올바르지 않습니다. (배포 주소·권한 확인)' }; }
  return j.result === 'success' ? { ok:true } : { ok:false, reason:'서버 오류: ' + (j.message || '') };
}
function downloadBackup(payload){
  try {
    const copy = Object.assign({}, payload, { image:'(생략)' });
    const blob = new Blob([JSON.stringify(copy, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `작도기록_${payload.studentId}_${payload.name}.json`;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e){}
}

// ===================== 그리기 =====================
function lineEnds(ax, ay, bx, by, type){
  const dx = bx - ax, dy = by - ay, T = 9000 / Math.hypot(dx, dy);
  if (type === 'segment') return [{x:ax,y:ay},{x:bx,y:by}];
  if (type === 'ray') return [{x:ax,y:ay},{x:ax+T*dx,y:ay+T*dy}];
  return [{x:ax-T*dx,y:ay-T*dy},{x:ax+T*dx,y:ay+T*dy}];
}
function drawScene(c, s, hl, box){
  const px = v => v / s;
  const b = box || { x:0, y:0, w:W, h:H };
  c.fillStyle = '#FBFDFF'; c.fillRect(b.x, b.y, b.w, b.h);
  // 제도용지 모눈
  c.strokeStyle = 'rgba(37,99,235,.09)'; c.lineWidth = px(1);
  const g = 50, x0 = Math.floor(b.x/g)*g, y0 = Math.floor(b.y/g)*g;
  c.beginPath();
  for (let x = x0; x <= b.x + b.w; x += g){ c.moveTo(x, b.y); c.lineTo(x, b.y + b.h); }
  for (let y = y0; y <= b.y + b.h; y += g){ c.moveTo(b.x, y); c.lineTo(b.x + b.w, y); }
  c.stroke();
  // 테두리는 제출용 그림에만 그립니다.
  // (화면에서는 축소할 때 네모 박스처럼 보여 작도를 방해합니다)
  if (!box){
    c.strokeStyle = 'rgba(37,99,235,.28)'; c.lineWidth = px(1.5);
    c.strokeRect(0, 0, W, H);
  }
  const alphaFor = o => (hl && !o.given && !hl.has(o.id)) ? 0.18 : 1;
  const strong = o => hl && hl.has(o.id);
  for (const o of objs) if (o.kind === 'circle'){
    const g = circGeom(o);
    c.globalAlpha = alphaFor(o); c.strokeStyle = o.given ? COL.given : COL.compass; c.lineWidth = px(o.given ? 2.4 : (strong(o) ? 2.4 : 1.5));
    c.beginPath(); c.arc(g.x, g.y, g.r, 0, Math.PI*2); c.stroke();
  }
  for (const o of objs) if (o.kind === 'line'){
    const a = P(o.p1), b = P(o.p2), e = lineEnds(a.x, a.y, b.x, b.y, o.ltype);
    c.globalAlpha = alphaFor(o); c.strokeStyle = o.given ? COL.given : COL.ruler;
    c.lineWidth = px(o.given ? 2.6 : (strong(o) ? 3 : 2));
    c.beginPath(); c.moveTo(e[0].x, e[0].y); c.lineTo(e[1].x, e[1].y); c.stroke();
    if (o.text){
      const at = o.textAt || { x:(a.x+b.x)/2, y:(a.y+b.y)/2 - 10 };
      c.fillStyle = '#111'; c.font = `italic bold ${px(18)}px serif`; c.fillText(o.text, at.x, at.y);
    }
  }
  for (const o of objs) if (o.kind === 'point' && !o.hidden){
    c.globalAlpha = alphaFor(o); c.fillStyle = PCOL[o.ptype];
    c.beginPath(); c.arc(o.x, o.y, px(o.given ? 4.5 : 4), 0, Math.PI*2); c.fill();
    if (state.showLabels && !o.noLabel && o.label){
      c.font = `${o.given ? 'bold ' : ''}${px(15)}px sans-serif`;
      c.fillStyle = o.given ? '#111' : '#374151';
      c.fillText(o.label, o.x + px(7), o.y - px(7));
    }
  }
  c.globalAlpha = 1;
}
function ring(c, p, r, color, s){
  c.strokeStyle = color; c.lineWidth = 2 / s;
  c.beginPath(); c.arc(p.x, p.y, r / s, 0, Math.PI*2); c.stroke();
}
function drawGhost(c, s){
  if (!state.ghost) return;
  const px = v => v / s;
  c.save(); c.setLineDash([px(9), px(6)]); c.lineWidth = px(2.4); c.strokeStyle = COL.hint;
  for (const st of state.ghost){
    if (st.k === 'point'){
      c.save(); c.setLineDash([]);
      c.fillStyle = 'rgba(5,150,105,.30)';
      c.beginPath(); c.arc(st.x, st.y, px(8), 0, Math.PI*2); c.fill();
      c.fillStyle = 'rgba(5,150,105,.85)';
      c.beginPath(); c.arc(st.x, st.y, px(3.4), 0, Math.PI*2); c.fill();
      c.setLineDash([px(4), px(3)]); c.lineWidth = px(2); c.strokeStyle = COL.hint;
      c.beginPath(); c.arc(st.x, st.y, px(13), 0, Math.PI*2); c.stroke();
      c.restore();
    }
    else if (st.k === 'circle'){ c.beginPath(); c.arc(st.c.x, st.c.y, st.r, 0, Math.PI*2); c.stroke(); }
    else if (st.k === 'line'){
      const e = lineEnds(st.a.x, st.a.y, st.b.x, st.b.y, st.ltype || 'line');
      c.beginPath(); c.moveTo(e[0].x, e[0].y); c.lineTo(e[1].x, e[1].y); c.stroke();
    }
  }
  c.restore();
}
function drawPreview(c, s){
  const px = v => v / s, sn = state.snap, pend = state.pending, t = state.tool;
  c.save(); c.setLineDash([px(6), px(5)]); c.lineWidth = px(1.6);
  if (sn && !state.skill){
    if (t === 'ruler' && pend.length === 1 && dist(pend[0], sn) > 1e-6){
      const e = lineEnds(pend[0].x, pend[0].y, sn.x, sn.y, state.rulerType);
      c.strokeStyle = COL.ruler; c.beginPath(); c.moveTo(e[0].x, e[0].y); c.lineTo(e[1].x, e[1].y); c.stroke();
    }
    if (t === 'compass' && pend.length === 1){
      c.strokeStyle = COL.compass; c.beginPath(); c.arc(pend[0].x, pend[0].y, dist(pend[0], sn), 0, Math.PI*2); c.stroke();
    }
    if (t === 'transfer' && pend.length === 1){
      c.strokeStyle = COL.compass; c.beginPath(); c.moveTo(pend[0].x, pend[0].y); c.lineTo(sn.x, sn.y); c.stroke();
    }
    if (t === 'transfer' && !pend.length && state.width){
      c.strokeStyle = COL.compass; c.beginPath(); c.arc(sn.x, sn.y, state.width.r, 0, Math.PI*2); c.stroke();
    }
  }
  c.setLineDash([]);
  pend.forEach(q => { if (q.type !== 'line') ring(c, q, 9, '#059669', s); });
  if (sn){
    const colr = { existing:'#059669', intersection:'#E11D48', on:'#7C3AED', free:'#94A3B8' }[sn.type];
    ring(c, sn, sn.type === 'free' ? 5 : 11, state.skill ? '#7c3aed' : colr, s);
  }
  c.restore();
}
function draw(){
  const k = state.view.k, v = state.view;
  ctx.setTransform(dpr*scale*k, 0, 0, dpr*scale*k, dpr*scale*v.x, dpr*scale*v.y);
  // 지금 화면에 보이는 작도판 영역
  const wCss = cv.width / dpr, hCss = cv.height / dpr;
  const box = { x:(-v.x)/k - 40, y:(-v.y)/k - 40, w:(wCss/scale)/k + 80, h:(hCss/scale)/k + 80 };
  drawScene(ctx, zs(), state.highlight, box);
  drawGhost(ctx, zs());
  drawPreview(ctx, zs());
}
function exportImage(hl){
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  drawScene(c.getContext('2d'), 1, hl);
  return c.toDataURL('image/png');
}
let lastW = 0, lastH = 0, resizeQueued = false, baseY = 0;
// 처음 보는 자리 — 작도판(가로 1000)을 화면 너비에 맞추고 세로는 가운데에 둡니다
function baseView(){ return { x:0, y:baseY, k:1 }; }
function atBase(){
  const v = state.view;
  return Math.abs(v.k - 1) < 1e-9 && Math.abs(v.x) < 0.5 && Math.abs(v.y - baseY) < 0.5;
}
function resize(){
  const wrap = document.querySelector('.boardwrap');
  if (!wrap) return;
  const wide = window.matchMedia('(min-width:1051px)').matches;
  const availW = wrap.clientWidth, availH = wrap.clientHeight;
  if (availW < 10) return;
  // 가로는 늘 꽉 채우고, 넓은 화면에서는 세로도 칸 전체를 채웁니다 (빈 여백 없음)
  const w = Math.round(availW);
  const h = Math.round((wide && availH > 10) ? availH : availW * H / W);
  const wasBase = atBase();
  if (Math.abs(w - lastW) < 0.5 && Math.abs(h - lastH) < 0.5) return;
  lastW = w; lastH = h;
  dpr = window.devicePixelRatio || 1; scale = w / W;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  baseY = Math.max(0, (h / scale - H) / 2);      // 남는 세로 공간을 위아래로 나눕니다
  if (wasBase) state.view = baseView();
  draw();
}
function queueResize(){            // 되먹임을 막기 위해 다음 그리기 차례에 처리합니다
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => { resizeQueued = false; resize(); });
}

  if (state.skill){
    const s = skill(state.skill);

    el.textContent = `[${s.name}] ${tip}${eulReul(tip)} 선택하세요.  (Esc 취소)`;
    return;
  }
  const n = state.pending.length, t = state.tool;
  const H_ = {
    pan:['작도판을 끌어 옮기고, 휠을 굴려 확대·축소합니다. (+ − 단추도 있습니다)'],
    point:['점을 찍을 곳을 누르세요.'],
    ruler:['자: 첫 번째 점을 선택하세요.', '자: 두 번째 점을 선택하세요.'],
    compass:['컴퍼스: 원의 중심을 선택하세요.', '컴퍼스: 원이 지날 점을 선택하세요.'],
    transfer: state.width ? ['길이 옮기기: 원의 중심을 찍으세요. (폭 고정됨)']
                          : ['길이 옮기기: 잴 길이의 한 끝점을 선택하세요.', '길이 옮기기: 다른 끝점을 선택하세요.']
  };
  const arr = H_[t];
  el.textContent = arr[Math.min(n, arr.length - 1)] + (n ? '  (Esc 취소)' : '');
}

function renderSkills(){
  const box = document.getElementById('skillDock');
  box.innerHTML = '';
  const noSkill = problem && problem.limit && problem.limit.skills === false;
  // 얻은 차례대로 번호를 붙입니다
  const mine = noSkill ? [] : progress.skills.map(id => skill(id)).filter(Boolean);
  if (!mine.length) return;
  const cap = document.createElement('div');
  cap.className = 'dockcap'; cap.textContent = '내 스킬';
  box.appendChild(cap);
  mine.forEach((s, i) => {
    const on = state.skill === s.id;
    const row = document.createElement('div');
    row.className = 'skrow' + (on ? ' on' : '');
    const cost = [s.cost.ruler ? `자${s.cost.ruler}` : '', s.cost.compass ? `컴${s.cost.compass}` : ''].filter(Boolean).join('·');
    row.innerHTML = `<span class="sklabel">${s.icon} ${s.name}<span class="c">${cost}</span></span>`;
    const b = document.createElement('button');
    b.className = 'sknum' + (on ? ' on' : '');
    b.textContent = i + 1;
    b.title = `${i+1}번 스킬 — ${s.name} (${cost}로 셉니다)`;
    b.onclick = () => {
      const turnOn = state.skill !== s.id;
      state.skill = turnOn ? s.id : null;
      state.pending = [];
      // 이동 상태에서는 작도판 클릭이 먹히지 않으므로, 스킬을 고르면 도구로 되돌립니다
      if (turnOn && state.tool === 'pan') pickTool(state.lastTool || 'ruler', true);
      if (turnOn) flashHint(`${i+1}번 스킬 [${s.name}] · ${s.tips[0]}${eulReul(s.tips[0])} 선택하세요.`);
      refresh(); renderSkills();
    };
    row.appendChild(b);
    box.appendChild(row);
  });
}
function renderProblems(){
  const box = document.getElementById('plist');
  box.innerHTML = '';
  const ps = problems();
  ps.forEach((p, i) => {
    const b = document.createElement('button');
    const solved = !!progress.solved[p.id];
    const locked = CONFIG.LOCK_ORDER && state.stage === 'step1' && i > 0 && !progress.solved[ps[i-1].id] && !solved;
    b.className = 'pbtn' + (i === state.idx ? ' on' : solved ? ' done' : '') + (locked ? ' lock' : '');
    b.textContent = i + 1;
    if (!locked) b.onclick = () => loadProblem(i);
    box.appendChild(b);
  });
}
function renderHints(){
  const seen = stats.hintsUsed.length, n = hintCount(), nx = nextHintLv();
  const pane = document.getElementById('hintPane');
  const open = pane && pane.classList.contains('show');
  const top = document.getElementById('btnHintTop');
  if (top){
    if (!seen){
      top.innerHTML = '💡 힌트 보기<span class="c">무료</span>';
      top.title = `이 문제는 힌트가 ${n}단계입니다. 첫 힌트는 무료입니다.`;
      top.onclick = () => useHint(0);
    } else {
      top.innerHTML = `💡 힌트<span class="c">${seen}/${n}</span>`;
      top.title = '본 힌트를 다시 엽니다';
      top.onclick = () => showHint(state.hintAt != null ? state.hintAt : seen - 1);
    }
  }
  const again = document.getElementById('btnHintAgain');
  if (again){
    if (seen && !open){
      again.style.display = 'block';
      again.textContent = `💡 힌트 다시 보기 (${seen}/${n} 단계까지 봤습니다)`;
      again.onclick = () => showHint(state.hintAt != null ? state.hintAt : seen - 1);
    } else again.style.display = 'none';
  }
}
function updateCounts(){
  const t = totals();
  document.getElementById('sRuler').textContent = t.ruler;
  document.getElementById('sCompass').textContent = t.compass;
  document.getElementById('sWidth').textContent = stats ? stats.widthChanges : 0;
  document.getElementById('tok').textContent = progress.coins;
  document.getElementById('score').textContent = finalScore();
  const ru = document.getElementById('btnUndo'), rd = document.getElementById('btnRedo');
  if (ru) ru.disabled = !actions.length && !state.pending.length;
  if (rd) rd.disabled = !redoStack.length;
}
function renderTabs(){
  document.querySelectorAll('.tab').forEach(t => {
    const open = stageOpen(t.dataset.stage);
    t.classList.toggle('lock', !open);
    const base = t.dataset.label || t.textContent;
    t.dataset.label = base;
    t.textContent = open ? base : '🔒 ' + base;
    t.classList.toggle('on', t.dataset.stage === state.stage);
  });
}
function renderAll(){ renderSkills(); renderProblems(); renderHints(); renderTabs(); updateCounts(); updateWidthBox(); }
function refresh(){ updateCounts(); setHint(); draw(); }

function askConfirm(text){
  return new Promise(resolve => {
    const m = document.getElementById('modal');
    document.getElementById('modalText').textContent = text;
    m.classList.remove('hidden');
    const yes = document.getElementById('modalYes'), no = document.getElementById('modalNo');
    const done = v => { m.classList.add('hidden'); yes.onclick = no.onclick = null; resolve(v); };
    yes.onclick = () => done(true); no.onclick = () => done(false);
  });
}

// ===================== 문제 불러오기 =====================
function loadProblem(i){
  const ps = problems();
  state.idx = i; problem = ps[i];
  objs = []; M = new Map(); nextId = 1; actions = []; log = []; seq = 0; redoStack = [];
  state.pending = []; state.highlight = null; state.snap = null; state.width = null; state.widthCost = 0;
  state.skill = null; state.ghost = null; state.hintAt = null; state.measuring = false; busy = false;
  stats = { start:Date.now(), undo:0, redo:0, reset:0, check:0, widthChanges:0, hintsUsed:[], outWarned:false };
  state.view = baseView();
  G = problem.setup();
  document.getElementById('pTitle').textContent = `${i+1}. ${problem.title}`;
  document.getElementById('pDesc').textContent = problem.desc;
  const lim = document.getElementById('pLimit');
  if (problem.limit){
    const parts = [];
    if (problem.limit.ruler != null) parts.push(`자 ${problem.limit.ruler}회`);
    if (problem.limit.compass != null) parts.push(`컴퍼스 ${problem.limit.compass}회`);
    if (problem.limit.skills === false) parts.push('스킬 잠김');
    lim.textContent = '제한: ' + parts.join(' · ');
    lim.style.display = 'block';
  } else lim.style.display = 'none';
  const sk = document.getElementById('btnSkip'), ag = document.getElementById('btnAgain');
  sk.style.display = state.stage === 'bonus' ? 'block' : 'none';
  sk.textContent = progress.skipped[problem.id] ? '다시 도전하기' : '이 챌린지 건너뛰기';
  ag.style.display = (state.stage === 'step2' && progress.solved[problem.id]) ? 'block' : 'none';
  const pane = document.getElementById('hintPane');
  pane.classList.remove('show'); pane.innerHTML = '';
  clearTimeout(ghostTimer);
  hideMsg(); renderAll(); refresh();
}

// ===================== 이벤트 =====================
function evtPoint(e){
  const r = cv.getBoundingClientRect(), v = state.view;
  return { x:((e.clientX - r.left)/scale - v.x)/v.k, y:((e.clientY - r.top)/scale - v.y)/v.k };
}
// 확대·축소 (cx, cy 는 캔버스 안의 CSS 픽셀 좌표)
function zoomAt(f, cx, cy){
  const v = state.view, nk = Math.min(4, Math.max(0.35, v.k * f));
  if (Math.abs(nk - v.k) < 1e-6) return;
  const wx = (cx/scale - v.x)/v.k, wy = (cy/scale - v.y)/v.k;
  v.k = nk; v.x = cx/scale - wx*nk; v.y = cy/scale - wy*nk;
  draw(); updateViewLabel();
}
function viewSize(){ return { w:(cv.width/dpr)/scale, h:(cv.height/dpr)/scale }; }
function resetView(){ state.view = baseView(); draw(); updateViewLabel(); }
// 지금 그린 것이 모두 들어오도록 맞춥니다
function bounds(){
  let x0 = 0, y0 = 0, x1 = W, y1 = H;
  for (const o of objs){
    if (o.kind === 'point' && !o.hidden){ x0 = Math.min(x0, o.x); x1 = Math.max(x1, o.x); y0 = Math.min(y0, o.y); y1 = Math.max(y1, o.y); }
    else if (o.kind === 'circle'){
      const c = P(o.center);
      x0 = Math.min(x0, c.x - o.r); x1 = Math.max(x1, c.x + o.r);
      y0 = Math.min(y0, c.y - o.r); y1 = Math.max(y1, c.y + o.r);
    }
  }
  return { x0:x0 - 30, y0:y0 - 30, x1:x1 + 30, y1:y1 + 30 };
}
function fitView(){
  const vs = viewSize(), b = bounds(), bw = b.x1 - b.x0, bh = b.y1 - b.y0;
  const k = Math.max(0.2, Math.min(1.6, Math.min(vs.w / bw, vs.h / bh)));
  state.view = { k, x:vs.w/2 - ((b.x0 + b.x1)/2) * k, y:vs.h/2 - ((b.y0 + b.y1)/2) * k };
  draw(); updateViewLabel();
}
// 그린 것이 화면 밖으로 나가면 한 번만 알려 줍니다
function warnOutside(){
  if (stats.outWarned) return;
  const v = state.view, k = v.k, b = bounds(), vs = viewSize();
  const vx0 = (-v.x)/k, vy0 = (-v.y)/k, vx1 = vx0 + vs.w/k, vy1 = vy0 + vs.h/k;
  if (b.x0 < vx0 || b.y0 < vy0 || b.x1 > vx1 || b.y1 > vy1){
    stats.outWarned = true;
    flashHint('작도한 것이 화면 밖으로 나갔습니다. [전체 보기]를 누르면 모두 보입니다.');
  }
}
function updateViewLabel(){
  const el = document.getElementById('viewPct');
  if (el) el.textContent = atBase() ? '' : ` (${Math.round(state.view.k*100)}%)`;
}
cv.addEventListener('pointerdown', e => {
  if (state.tool !== 'pan' && e.button !== 1) return;     // 가운데 버튼으로도 옮길 수 있습니다
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  state.drag = { x:e.clientX - r.left, y:e.clientY - r.top, vx:state.view.x, vy:state.view.y };
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
});
cv.addEventListener('pointermove', e => {
  if (state.drag){
    const r = cv.getBoundingClientRect();
    state.view.x = state.drag.vx + ((e.clientX - r.left) - state.drag.x)/scale;
    state.view.y = state.drag.vy + ((e.clientY - r.top) - state.drag.y)/scale;
    draw(); return;
  }
  if (state.tool === 'pan' && !state.skill){ state.snap = null; return; }
  state.snap = snapCandidate(evtPoint(e)); draw();
});
cv.addEventListener('pointerup', e => {
  if (state.drag){ state.drag = null; try { cv.releasePointerCapture(e.pointerId); } catch(_){} updateViewLabel(); }
});
cv.addEventListener('pointerleave', () => { state.snap = null; draw(); });
cv.addEventListener('click', e => { handleClick(evtPoint(e)); state.snap = null; draw(); });
cv.addEventListener('contextmenu', e => { e.preventDefault(); state.pending = []; refresh(); });
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  zoomAt(e.deltaY < 0 ? 1.12 : 1/1.12, e.clientX - r.left, e.clientY - r.top);
}, { passive:false });
document.getElementById('btnZoomIn').addEventListener('click', () => zoomAt(1.25, cv.clientWidth/2, cv.clientHeight/2));
document.getElementById('btnZoomOut').addEventListener('click', () => zoomAt(1/1.25, cv.clientWidth/2, cv.clientHeight/2));
document.getElementById('btnZoomReset').addEventListener('click', resetView);
document.getElementById('btnFit').addEventListener('click', fitView);
function pickTool(t, keepSkill){
  state.tool = t; state.pending = []; state.measuring = false;
  if (!keepSkill) state.skill = null;
  if (t !== 'pan') state.lastTool = t;        // 이동에서 돌아올 자리를 기억해 둡니다
  document.querySelectorAll('.tool-btn').forEach(x => x.classList.toggle('active', x.dataset.tool === t));
  cv.classList.toggle('panning', t === 'pan');
  renderSkills(); updateWidthBox(); refresh();
}
document.querySelectorAll('.tool-btn').forEach(b => b.addEventListener('click', () => pickTool(b.dataset.tool)));
document.querySelectorAll('input[name=rtype]').forEach(r => r.addEventListener('change', () => {
  state.rulerType = r.value;
  if (state.tool !== 'ruler' || state.skill){            // 선 종류를 고르면 자가 바로 켜집니다
    state.tool = 'ruler'; state.skill = null; state.pending = [];
    document.querySelectorAll('.tool-btn').forEach(x => x.classList.toggle('active', x.dataset.tool === 'ruler'));
    cv.classList.remove('panning'); renderSkills();
  }
  refresh();
}));
document.getElementById('btnRemeasure').addEventListener('click', () => {
  if (state.measuring){                        // 재는 중에 다시 누르면 그만둡니다
    state.measuring = false; state.pending = []; updateWidthBox(); refresh(); return;
  }
  state.width = null; state.widthCost = 0; state.pending = [];
  state.measuring = true;                      // 다음 두 점은 반드시 '길이 재기'로 받습니다
  state.tool = 'transfer'; state.skill = null; // 바로 잴 수 있도록 도구도 바꿔 줍니다
  document.querySelectorAll('.tool-btn').forEach(x => x.classList.toggle('active', x.dataset.tool === 'transfer'));
  cv.classList.remove('panning');
  renderSkills(); updateWidthBox(); refresh();
  flashHint('길이를 다시 잽니다. 두 점을 차례로 찍으세요.');
});
document.getElementById('btnUndo').addEventListener('click', undo);
document.getElementById('btnRedo').addEventListener('click', redo);
document.getElementById('btnReset').addEventListener('click', resetWork);
document.getElementById('btnCheck').addEventListener('click', onCheck);
document.getElementById('btnSubmit').addEventListener('click', () => submit(false));
document.getElementById('btnSkip').addEventListener('click', () => {
  if (progress.skipped[problem.id]){
    progress.skipped[problem.id] = false;
    document.getElementById('btnSkip').textContent = '이 챌린지 건너뛰기';
    showMsg('다시 도전합니다. 화이팅!', 'info'); return;
  }
  progress.skipped[problem.id] = true;
  progress.records.push({ id:problem.id, title:problem.title, stage:state.stage, solved:'건너뜀',
    sec:elapsed(), ruler:0, compass:0, rulerM:'', compassM:'', rulerX:'', compassX:'',
    width:0, undo:0, reset:0, check:0, hints:'', score:0, strategy:'' });
  addLog('skip', '보너스 건너뛰기');
  document.getElementById('btnSkip').textContent = '다시 도전하기';
  showMsg('건너뛰었습니다. 나중에 이 화면에서 다시 도전할 수 있습니다.', 'info');
});
document.getElementById('btnAgain').addEventListener('click', () => {
  const i = state.idx; loadProblem(i);
  showMsg('앞에서 쓴 것과 <b>다른 계열의 방법</b>으로 다시 작도해 보세요. 성공하면 점수를 더 받습니다.', 'info');
});
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  const st = t.dataset.stage;
  if (!stageOpen(st)){ showMsg('🔒 아직 열리지 않은 단계입니다. ' + stageNeed(st), 'warn'); return; }
  state.stage = st; loadProblem(0);
}));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape'){ pickTool('pan'); flashHint('취소하고 이동 상태로 돌아왔습니다.'); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y'){ e.preventDefault(); redo(); }
});
window.addEventListener('beforeunload', e => {
  if (progress.records.length && progress.submitted < progress.records.length){ e.preventDefault(); e.returnValue = ''; }
});

// 학번·이름을 입력하고 [시작]을 누르면 입력칸이 잠깁니다
function startApp(){
  const idEl = document.getElementById('sid'), nmEl = document.getElementById('sname');
  if (!idEl.value.trim() || !nmEl.value.trim()){
    flashHint('학번과 이름을 입력한 뒤 [시작]을 누르세요.');
    (idEl.value.trim() ? nmEl : idEl).focus();
    return;
  }
  started = true;
  [idEl, nmEl].forEach(el => { el.readOnly = true; el.style.opacity = '.65'; el.style.cursor = 'default'; });
  const b = document.getElementById('btnStart');
  b.textContent = '작도 시작됨'; b.disabled = true; b.classList.remove('primary');
  progress.startAll = Date.now();
  setHint();
}
document.getElementById('btnStart').addEventListener('click', startApp);
['sid','sname'].forEach(i => document.getElementById(i).addEventListener('keydown', e => { if (e.key === 'Enter') startApp(); }));
setTimeout(() => document.getElementById('sid').focus(), 100);

document.querySelector('footer').textContent = CONFIG.FOOTER;
progress.startAll = Date.now();
new ResizeObserver(queueResize).observe(document.querySelector('.boardwrap'));
window.addEventListener('resize', queueResize);
loadProblem(0);
resize();
</script>
