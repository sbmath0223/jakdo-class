<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>작도 교실</title>
<style>
  :root{
    --deep:#081A2E; --deep2:#113A63;
    --glass:rgba(255,255,255,.10); --glass2:rgba(255,255,255,.16); --glass3:rgba(255,255,255,.22);
    --edge:rgba(150,205,255,.30); --edge2:rgba(170,220,255,.55);
    --text:#E8F1FB; --muted:#9DB4CE;
    --cobalt:#3B82F6; --cyan:#22D3EE; --amber:#F6B93B; --mint:#34D399; --rose:#FB7185;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--text);
    font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:
      radial-gradient(1100px 620px at 12% -8%, #1C5285 0%, rgba(28,82,133,0) 62%),
      radial-gradient(900px 560px at 98% 4%, #0E5C73 0%, rgba(14,92,115,0) 58%),
      linear-gradient(170deg, var(--deep) 0%, var(--deep2) 58%, #0A2742 100%);
    background-attachment:fixed;
  }
  /* 제도용지 모눈 */
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(rgba(140,200,255,.055) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(140,200,255,.055) 1px,transparent 1px);
    background-size:34px 34px;
  }
  header,main,footer{position:relative;z-index:1}
  .glass{
    background:var(--glass);
    border:1px solid var(--edge);
    border-radius:var(--r);
    backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.26), 0 10px 30px rgba(3,16,32,.30);
  }
  header{
    /* 아래 main 과 같은 칸 나누기: 제목 | 작도판이 시작되는 자리 | 학번·점수 */
    /* 첫 칸은 도구 패널(176px)에서 머리글 자체의 여백 12px 을 뺀 값입니다 */
    display:grid;grid-template-columns:164px minmax(0,1fr) auto;align-items:center;gap:12px;
    padding:12px;margin:12px auto 0;max-width:1580px;width:calc(100% - 24px);
    background:var(--glass2);border:1px solid var(--edge);border-radius:var(--r);
    backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 10px 30px rgba(3,16,32,.28);
  }
  header h1{font-size:19px;margin:0;letter-spacing:-.01em;font-weight:800;display:flex;align-items:center;gap:9px}
  header h1 svg{width:26px;height:26px;opacity:.95}
  .who{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-self:end}
  .who input{
    padding:8px 11px;border:1px solid var(--edge);border-radius:10px;font-size:15px;width:118px;
    font-family:inherit;background:rgba(255,255,255,.09);color:var(--text);
  }
  .who input::placeholder{color:rgba(205,222,240,.55)}
  .who input:focus{outline:2px solid var(--cyan);outline-offset:1px;background:rgba(255,255,255,.14)}
  .meter{
    display:flex;align-items:baseline;gap:6px;padding:6px 14px;border-radius:999px;
    background:rgba(255,255,255,.10);border:1px solid var(--edge);
    font-variant-numeric:tabular-nums;
  }
  .meter .lab{font-size:11.5px;font-weight:700;color:rgba(214,232,250,.78);letter-spacing:-.01em}
  .meter .val{font-size:17px;font-weight:800;letter-spacing:-.01em}
  .meter .sym{font-size:13px}
  .meter.coin .val,.meter.coin .sym{color:var(--amber)}
  .meter.score .val{color:var(--cyan)}
  .hintbtn{
    display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:999px;
    border:1px solid rgba(246,185,59,.55);background:rgba(246,185,59,.18);color:#FCE9BE;
    font-family:inherit;font-size:13px;font-weight:800;line-height:1;cursor:pointer;white-space:nowrap;
  }
  .hintbtn:hover{background:rgba(246,185,59,.28)}
  .hintbtn:disabled{opacity:.5;cursor:default}
  .hintbtn.dis{opacity:.5}
  .hintbtn .c{font-weight:700;opacity:.9}
  .hintgroup{display:flex;align-items:center;gap:6px;min-width:0}
  .hintbtn.on{background:#F6B93B;color:#3A2A00;border-color:#FFE3A6}
  .hintnav{display:flex;align-items:center;gap:3px}
  .hintnav[hidden]{display:none}
  .harr{
    width:27px;height:27px;border-radius:50%;cursor:pointer;padding:0;
    border:1px solid rgba(246,185,59,.55);background:rgba(246,185,59,.16);color:#FCE9BE;
    font-family:inherit;font-size:19px;font-weight:800;line-height:1;
  }
  .harr:hover:not(:disabled){background:rgba(246,185,59,.32)}
  .harr:disabled{opacity:.35;cursor:default}
  /* 아직 열지 않은 힌트: 화살표 옆에 코인 그림과 값이 붙어 '코인을 내고 연다'는 뜻을 보여 줍니다 */
  .harr.lock{width:auto;padding:0 9px 0 8px;display:inline-flex;align-items:center;gap:3px;border-radius:999px;font-size:15px;
    background:rgba(246,185,59,.30);border:1.5px solid rgba(246,185,59,.85);color:#FFF1D4}
  .harr.lock .ic{width:15px;height:15px}
  .harr.lock b{font-size:12.5px;font-weight:800;line-height:1}
  .hno{min-width:26px;text-align:center;font-size:15px;font-weight:800;color:#FFE3A6;font-variant-numeric:tabular-nums}
  button.meter{font-family:inherit;color:inherit;cursor:pointer}
  button.meter:hover{background:rgba(255,255,255,.17)}
  .meter.bump{animation:bagpop .6s ease}
  .ic{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
  .meter .ic{width:18px;height:18px;align-self:center}
  .meter .lab{margin-right:1px}
  /* 점수 교환 카드 — 큰 화면에서는 오른쪽 칸의 빈 자리에 떠서 다른 패널을 가리지 않습니다 */
  .xchg{display:none;position:fixed;z-index:40;width:300px;padding:12px 14px 14px;border-radius:16px;
    background:rgba(13,38,68,.97);border:1px solid var(--edge2);box-shadow:0 18px 44px rgba(2,12,26,.55);
    animation:ovin .2s ease}
  .xchg.open{display:block}
  .xhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .xhd b{font-size:14.5px;letter-spacing:-.01em}
  .xchg .xx{width:26px;height:26px;border-radius:50%;border:1px solid var(--edge);background:transparent;color:var(--text);
    cursor:pointer;font-family:inherit;font-size:12px;font-weight:800;padding:0;opacity:.85}
  .xbal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .xb{display:flex;align-items:center;justify-content:space-between;padding:7px 11px;border-radius:12px;
    background:rgba(255,255,255,.08);border:1px solid rgba(150,205,255,.2);font-size:12px;color:var(--muted);font-weight:700}
  .xb b{display:inline-flex;align-items:center;gap:5px;font-size:17px;color:var(--text);font-variant-numeric:tabular-nums}
  .xrow{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 0;
    border-top:1px solid rgba(150,205,255,.18);border-bottom:1px solid rgba(150,205,255,.18)}
  .xstep{display:flex;align-items:center;gap:5px}
  .xstep button{width:26px;height:26px;border-radius:50%;border:1px solid var(--edge);background:rgba(255,255,255,.12);color:var(--text);
    font-family:inherit;font-size:16px;font-weight:800;line-height:1;cursor:pointer;padding:0}
  .xstep button:hover:not(:disabled){background:rgba(255,255,255,.22)}
  .xstep button:disabled{opacity:.3;cursor:default}
  .xv{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:56px;padding:4px 8px;border-radius:10px;
    background:rgba(255,255,255,.07);font-size:18px}
  .xv b{font-variant-numeric:tabular-nums}
  .xarrow{width:22px;height:22px;flex:none;color:var(--cyan)}
  .xft{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px}
  .xft .xh{font-size:11.5px;color:var(--muted);line-height:1.4}
  .xft .btn{padding:8px 16px;font-size:13.5px;flex:none}
  body.locked button:not(#btnLogin){opacity:.45;cursor:not-allowed}
  main{display:grid;grid-template-columns:176px minmax(0,1fr) 320px;gap:12px;padding:12px;max-width:1580px;margin:0 auto;align-items:start}
  .card{
    background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);padding:11px;
    backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 10px 26px rgba(3,16,32,.26);
  }
  h3.sec{font-size:11.5px;letter-spacing:.06em;color:var(--muted);margin:2px 0 9px;font-weight:700}
  .tools{display:flex;flex-direction:column;gap:7px}
  main > .leftcol, .leftcol > aside.card{min-width:0;width:100%;box-sizing:border-box}
  .widthbox{min-height:74px;box-sizing:border-box;overflow:hidden}
  .widthbox .wsub{overflow-wrap:anywhere}
  .tool-btn{
    display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 5px;
    border:1px solid var(--edge);border-radius:12px;background:rgba(255,255,255,.07);
    cursor:pointer;font-size:13.5px;font-weight:700;color:var(--text);font-family:inherit;line-height:1.25;
    transition:background .15s, border-color .15s, transform .08s;
  }
  .tool-btn small{font-weight:400;color:var(--muted)}
  .tool-btn{justify-content:center;text-align:center;width:100%;box-sizing:border-box}
  .tool-btn svg{display:block;margin:0 auto;flex:none}
  .tool-btn[data-tool="point"] svg{position:relative;top:-4px}   /* 아이콘 위아래 빈 칸이 달라 생기는 쏠림 보정 */
  .tool-btn[data-tool="ruler"] svg{position:relative;top:-1px}
  .tool-btn svg{width:30px;height:30px}
  .tool-btn:hover{background:rgba(255,255,255,.13)}
  .tool-btn:active{transform:translateY(1px)}
  .tool-btn.active{
    background:linear-gradient(180deg, rgba(34,211,238,.26), rgba(59,130,246,.20));
    border-color:var(--edge2);color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 0 0 1px rgba(34,211,238,.35);
  }
  .sub{display:flex;flex-direction:column;gap:4px;font-size:12.5px;padding:7px 3px 2px;border-top:1px solid rgba(150,205,255,.18);color:var(--text)}
  .sub label{cursor:pointer;display:flex;align-items:center;gap:5px}
  .widthbox{font-size:12px;background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.32);border-radius:10px;padding:7px;margin-top:6px;line-height:1.5}
  .widthbox b{color:var(--cyan)}
  .mini.off,.mini:disabled{opacity:.4;cursor:default}
  .mini{width:100%;padding:6px;margin-top:5px;border:1px solid var(--edge);border-radius:9px;background:rgba(255,255,255,.08);font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:700;color:var(--text)}
  .mini:hover{background:rgba(255,255,255,.14)}
  /* 제목 줄에 놓인 화면 조작 단추 — 이동 / 확대 / 축소 를 따로 둡니다 */
  .viewbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-self:start}
  .vbtn{
    display:inline-flex;flex-direction:row;align-items:center;gap:6px;width:auto;
    padding:7px 13px;border:1px solid var(--edge);border-radius:999px;
    background:rgba(255,255,255,.08);color:var(--text);font-family:inherit;
    font-size:12.8px;font-weight:700;line-height:1;white-space:nowrap;cursor:pointer;
  }
  .vbtn:hover{background:rgba(255,255,255,.15)}
  .vbtn svg{width:17px;height:17px;flex:none}
  .vbtn.active{
    background:linear-gradient(180deg,rgba(34,211,238,.26),rgba(59,130,246,.20));
    border-color:var(--edge2);color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.42), 0 0 0 1px rgba(34,211,238,.32);
  }
  .skill{
    display:flex;align-items:center;gap:7px;width:100%;padding:8px 9px;border:1px solid var(--edge);
    border-radius:10px;background:rgba(255,255,255,.07);font-size:13px;cursor:pointer;font-family:inherit;
    text-align:left;margin-bottom:5px;color:var(--text);font-weight:700;
  }
  .skill:hover{background:rgba(255,255,255,.13)}
  .skill.locked{opacity:.38;cursor:not-allowed;font-weight:400}
  .skill.active{background:linear-gradient(180deg,rgba(34,211,238,.26),rgba(59,130,246,.18));border-color:var(--edge2);color:#fff}
  .skill .k{font-size:15px}
  /* 작도판 오른쪽 위의 스킬 가방 */
  #skillDock{position:absolute;top:9px;left:9px;bottom:9px;z-index:5;display:flex;flex-direction:column;
    gap:6px;align-items:flex-start;pointer-events:none;line-height:1}
  .bagrow{display:flex;align-items:center;gap:8px;flex:none}
  .bagbtn{
    pointer-events:auto;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;
    width:52px;padding:6px 0 7px;border-radius:14px;cursor:pointer;transform-origin:0 0;
    border:1px solid rgba(150,205,255,.36);background:rgba(11,37,69,.80);color:#DCEEFF;font-family:inherit;
    backdrop-filter:blur(10px) saturate(150%);-webkit-backdrop-filter:blur(10px) saturate(150%);
    box-shadow:0 6px 16px rgba(3,16,32,.28);
  }
  .bagbtn:hover{background:rgba(23,62,106,.90)}
  .bagcap{font-size:10.5px;font-weight:800;letter-spacing:.05em}
  .bagbtn svg{width:26px;height:26px}
  .bagn{position:absolute;top:-7px;left:-7px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
    background:#F6B93B;color:#3A2A00;font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .bagn:not(:empty){display:flex}
  #skillDock.open .bagbtn,.bagbtn.on{background:linear-gradient(180deg,rgba(34,211,238,.88),rgba(59,130,246,.82));
    border-color:#BFE9FF;color:#06243D}
  #skillDock.locked .bagbtn{opacity:.5}
  .bagbtn.pop{animation:bagpop .75s ease}
  @keyframes bagpop{0%{transform:scale(1)}25%{transform:scale(1.45)}55%{transform:scale(1.2)}100%{transform:scale(1)}}
  .plus1{position:absolute;left:68px;top:14px;font-size:19px;font-weight:900;color:#FDE68A;pointer-events:none;
    text-shadow:0 2px 8px rgba(0,0,0,.55),0 0 10px rgba(246,185,59,.7);animation:plusup 1.5s ease forwards}
  @keyframes plusup{0%{opacity:0;transform:translateY(10px) scale(.5)}20%{opacity:1;transform:translateY(0) scale(1.25)}
    100%{opacity:0;transform:translateY(-26px) scale(1)}}
  .bagact{
    pointer-events:auto;max-width:190px;padding:5px 10px;border-radius:999px;cursor:pointer;white-space:nowrap;
    border:1px solid #BFE9FF;background:linear-gradient(180deg,rgba(34,211,238,.92),rgba(59,130,246,.86));
    color:#06243D;font-family:inherit;font-size:11.5px;font-weight:800;line-height:1;box-shadow:0 6px 16px rgba(3,16,32,.26);
  }
  .baglist{display:flex;flex-direction:column;gap:5px;align-items:flex-start;height:0;pointer-events:none;
    min-height:0;overflow:hidden;scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain;padding:2px 14px 8px 2px}
  .baglist::-webkit-scrollbar{display:none}
  #skillDock.open .baglist{height:auto;flex:0 1 auto;overflow-y:auto;pointer-events:auto;touch-action:pan-y}
  .bagitem,.bagempty{
    opacity:0;transform:translateY(-18px) scale(.55);transform-origin:0 0;
    transition:opacity .16s ease,transform .22s cubic-bezier(.3,1.25,.5,1);
  }
  #skillDock.open .bagitem,#skillDock.open .bagempty{opacity:1;transform:none;pointer-events:auto;transition-delay:calc(var(--i,0)*45ms)}
  .bagitem{
    display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;
    border:1px solid rgba(150,205,255,.36);background:rgba(11,37,69,.88);color:#DCEEFF;font-family:inherit;
    font-size:12.5px;font-weight:700;line-height:1;box-shadow:0 6px 16px rgba(3,16,32,.28);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .bagitem:hover{background:rgba(23,62,106,.92)}
  .bagitem.on{background:linear-gradient(180deg,rgba(34,211,238,.9),rgba(59,130,246,.85));border-color:#BFE9FF;color:#06243D}
  .bagitem .c{opacity:.7;font-weight:600;font-size:11px}
  .bagempty{padding:8px 12px;border-radius:12px;background:rgba(11,37,69,.88);border:1px solid rgba(150,205,255,.3);
    color:#BBD3EA;font-size:11.5px;line-height:1.5;text-align:left;white-space:nowrap}
  #board{padding:0;overflow:hidden;position:relative;display:flex;flex-direction:column}
  .boardwrap{flex:1;min-height:0;display:flex}
  .cvbox{position:relative;line-height:0;flex:1;min-width:0}
  canvas{display:block;touch-action:none;cursor:crosshair;background:#FBFDFF}
  /* 작도판 왼쪽 위의 조작 단추 */
  #boardbar{position:absolute;top:9px;right:9px;z-index:3;display:flex;gap:5px;align-items:center;line-height:1}
  .bb{
    display:inline-flex;align-items:center;justify-content:center;gap:5px;height:31px;padding:0 12px;
    border-radius:999px;border:1px solid rgba(150,205,255,.34);background:rgba(11,37,69,.74);
    color:#DCEEFF;font-family:inherit;font-size:12.5px;font-weight:700;line-height:1;cursor:pointer;
    backdrop-filter:blur(10px) saturate(150%);-webkit-backdrop-filter:blur(10px) saturate(150%);
    box-shadow:0 6px 16px rgba(3,16,32,.26);white-space:nowrap;
  }
  .bb:hover:not(:disabled){background:rgba(23,62,106,.86)}
  .bb:disabled{opacity:.4;cursor:default}
  .bb.ic{width:31px;padding:0}
  .bb.ic svg{width:17px;height:17px}
  .bb.go{background:linear-gradient(180deg,#3B82F6,#2563EB);border-color:rgba(190,225,255,.5);color:#fff}
  .bb.go:hover{background:linear-gradient(180deg,#4C8DF8,#2E6CE8)}
  .bb.send{background:linear-gradient(180deg,#10B981,#059669);border-color:rgba(190,255,230,.45);color:#fff}
  .bb.send.nudge{animation:nudge 1.1s ease-in-out infinite;box-shadow:0 0 0 3px rgba(52,211,153,.55)}
  @keyframes nudge{50%{transform:scale(1.07);box-shadow:0 0 0 7px rgba(52,211,153,.12)}}
  .rs-sub{margin-top:8px;padding:7px 10px;border-radius:10px;background:rgba(16,185,129,.18);border:1px solid rgba(110,231,183,.5);font-weight:700;line-height:1.5}
  .bb.send:hover{background:linear-gradient(180deg,#17C78B,#06A678)}
  /* 작도판 위에 뜨는 안내창 (성공 · 실패 · 힌트) */
  #overlay{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:4;
    width:min(620px,calc(100% - 24px));display:flex;flex-direction:column;gap:8px;line-height:1.5;
    pointer-events:none;max-height:calc(100% - 24px)}
  #overlay > *{pointer-events:auto}
  #overlay .xchg{position:static;width:auto;box-shadow:0 14px 34px rgba(3,16,32,.5)}
  #overlay .msg,#overlay .hintpane{margin:0;max-height:min(44vh,320px);overflow:auto;
    box-shadow:0 14px 34px rgba(3,16,32,.5);animation:ovin .2s ease}
  @keyframes ovin{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  #overlay .msg{color:#E8F1FB;background:rgba(10,32,58,.96)}
  #overlay .msg.ok{background:linear-gradient(rgba(52,211,153,.2),rgba(52,211,153,.2)),rgba(10,32,58,.97);color:#D3F8E9}
  #overlay .msg.warn{background:linear-gradient(rgba(246,185,59,.2),rgba(246,185,59,.2)),rgba(10,32,58,.97);color:#FBE6BC}
  #overlay .msg.err{background:linear-gradient(rgba(251,113,133,.2),rgba(251,113,133,.2)),rgba(10,32,58,.97);color:#FFD2DA}
  #overlay .msg.info{background:linear-gradient(rgba(34,211,238,.17),rgba(34,211,238,.17)),rgba(10,32,58,.97);color:#CBF2FA}
  #overlay .hintpane{background:linear-gradient(rgba(246,185,59,.17),rgba(246,185,59,.17)),rgba(10,32,58,.97)}
  .hintpane .note{margin-top:7px;font-size:12px;font-weight:700;color:#FFE3A6}
  #overlay .msg:has(.rs){max-height:min(52vh,340px)}
  .rs{display:flex;flex-direction:column;gap:9px;padding-right:26px}
  .rs-t{font-weight:700;font-size:1.05em;line-height:1.4}
  .rs-m{font-size:.9em;opacity:.8;line-height:1.5}

  /* 가벼운 확인창(처음부터): 흐림 없이 아래에서 살짝 올라옵니다 */
  .modal.soft{background:rgba(5,16,30,.22);backdrop-filter:none;align-items:flex-end;padding-bottom:max(18px,env(safe-area-inset-bottom))}

  .modal.soft .modal-box p{font-weight:800;font-size:16px;margin-bottom:4px}
  .modal.soft .modal-box small{display:block;color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:14px}

.hintbtn{background:rgba(246,185,59,.30)!important;border-color:#F6B93B!important;color:#FFF1D4!important}
.hintbtn.on{background:#F6B93B!important;color:#3A2A00!important}
.harr,.harr.lock{background:rgba(120,88,20,.85)!important;border-color:#F6B93B!important;color:#FFF1D4!important}

  /* 수학 기호 표기: 선분 AB̅ · 반직선 AB→ · 직선 AB↔ (글 속에서 길이나 식과 함께 쓸 때) */
  .ov{position:relative;display:inline-block;white-space:nowrap;line-height:1.15}

function snapCandidate(p){
  // 끌어다 맞추는 범위는 작도판 기준으로 고정합니다.
  // (축소해서 볼 때 범위가 같이 넓어지면 아무 데나 눌러도 교점에 붙어 버립니다)
  const z = Math.max(zs(), scale);
  const tp = 14 / z, tc = 10 / z;
  let pt = null, pd = tp;
  for (const o of objs){
    if (o.kind !== 'point' || o.hidden) continue;
    const d = dist(o, p); if (d < pd){ pd = d; pt = o; }
  }
  let it = null, idd = tp;
  const near = objs.filter(o => o.kind !== 'point' && distToCurve(o, p).d < tp * 1.5);
  for (let i = 0; i < near.length; i++) for (let j = i + 1; j < near.length; j++)
    for (const q of intersect(near[i], near[j])){
      const d = dist(q, p);
      if (d < idd){ idd = d; it = { x:q.x, y:q.y, parents:[near[i].id, near[j].id] }; }
    }
  if (pt && (!it || pd <= idd + 3 / zs())) return { type:'existing', point:pt, x:pt.x, y:pt.y };
  if (it){
    for (const o of objs) if (o.kind === 'point' && !o.hidden && dist(o, it) < 1e-6)
      return { type:'existing', point:o, x:o.x, y:o.y };
    return { type:'intersection', x:it.x, y:it.y, parents:it.parents };
  }
  let cc = null, cd = tc;
  for (const o of objs){
    if (o.kind === 'point') continue;
    const r = distToCurve(o, p);
    if (r.d < cd){ cd = r.d; cc = { type:'on', x:r.x, y:r.y, parents:[o.id] }; }
  }

}

  const o = addObj({ kind:'point', x:c.x, y:c.y, ptype:c.type, parents:(c.parents || []).slice(), label:nextLabel() });
  created.push(o.id);
  return o;
}

function parallelSetup(py){
  const l1 = gp('',60,500,{hidden:true}), l2 = gp('',940,500,{hidden:true});

function parallelCheck(g){
  const l = P(g.l), Pp = P(g.P), gg = lineGeom(l), n1 = Math.hypot(gg.dx, gg.dy);
  for (const L of rulerLines()){
    if (!drawnLine(L) || !through(L, Pp)) continue;
    const h = lineGeom(L), n2 = Math.hypot(h.dx, h.dy);
    if (Math.abs(gg.dx*h.dy - gg.dy*h.dx) / (n1*n2) < 1e-6)
      return { ok:true, ids:[L.id], msg:'점 P를 지나고 직선 l에 평행한 직선을 작도했습니다.' };
  }
  return { ok:false, msg:'점 P를 지나면서 직선 l과 평행한 직선을 아직 찾지 못했어요.'+NEED_PT };
}
// 어떤 계열의 방법을 썼는지 자동 분류
function classify(ansIds, g){
  const anc = ancestors(ansIds), l = P(g.l);
  const inSet = [...anc].map(P).filter(Boolean);
  const sk = new Set(actions.filter(a => a.skillId && a.ids.some(id => anc.has(id))).map(a => a.skillId));
  if (sk.has('angle')) return '각 이용 (각 옮기기)';
  if (sk.has('perpdown') || sk.has('perpup')) return '각 이용 (수선 두 번)';
  if (sk.has('mid') || sk.has('sym') || sk.has('diam')) return '삼각형·원 이용 (중점·점대칭)';
  if (sk.has('copy')) return '사각형 이용 (같은 길이 옮기기)';
  const lines = inSet.filter(o => o.kind === 'line' && !o.given);
  if (lines.some(L => perpTo(l, P(L.p1), P(L.p2)))) return '각 이용 (수선 두 번)';
  const pts = inSet.filter(o => o.kind === 'point');
  for (const m of pts) for (const a of pts) for (const b of pts){
    if (m === a || m === b || a === b) continue;
    if (Math.abs(dist(a,m) - dist(b,m)) < 0.3 && Math.abs(dist(a,m) + dist(b,m) - dist(a,b)) < 0.3)
      return '삼각형·원 이용 (중점·점대칭)';
  }
  const rs = inSet.filter(o => o.kind === 'circle').map(o => o.r).sort((x,y) => x-y);
  let run = 1, best = 1;
  for (let i = 1; i < rs.length; i++){ if (Math.abs(rs[i]-rs[i-1]) < 0.5){ run++; best = Math.max(best, run); } else run = 1; }
  if (best >= 2) return '사각형 이용 (같은 반지름 원)';
  return '각 이용 (각 옮기기)';
}

    const id = st.pop(); if (S.has(id)) continue;
    const o = P(id); if (!o) continue;
    S.add(id); o.parents.forEach(p => st.push(p));
  }
  return S;
}
function meaningfulCount(ansIds){
  const anc = ancestors(ansIds);
  let r = 0, c = 0; const used = [];
  for (const a of actions){
    if (a.ids.some(id => anc.has(id))){ r += a.ruler; c += a.compass; used.push(a.seq); }
  }
  return { ruler:r, compass:c, total:r + c, used:new Set(used) };
}

// 점 도구: 고른 종류에 맞는 자리만 찾습니다. (교점은 교점 근처, 대상 위의 점은 선·원 근처를 눌러야 합니다)
function pointCandidate(p, mode){
  const z = Math.max(zs(), scale);
  if (mode === 'free') return { type:'free', x:p.x, y:p.y, parents:[] };
  if (mode === 'inter'){
    const tp = 20 / z;
    let it = null, idd = tp;
    const near = objs.filter(o => o.kind !== 'point' && !o.hidden && distToCurve(o, p).d < tp * 1.6);
    for (let i = 0; i < near.length; i++) for (let j = i + 1; j < near.length; j++)
      for (const q of intersect(near[i], near[j])){
        const d = dist(q, p);
        if (d < idd){ idd = d; it = { x:q.x, y:q.y, parents:[near[i].id, near[j].id] }; }
      }
    if (!it) return null;
    for (const o of objs) if (o.kind === 'point' && !o.hidden && dist(o, it) < 1e-6)
      return { type:'existing', point:o, x:o.x, y:o.y };
    return { type:'intersection', x:it.x, y:it.y, parents:it.parents };
  }
  const tc = 16 / z;
  let cc = null, cd = tc;
  for (const o of objs){
    if (o.kind === 'point' || o.hidden) continue;
    const r = distToCurve(o, p);
    if (r.d < cd){ cd = r.d; cc = { type:'on', x:r.x, y:r.y, parents:[o.id] }; }
  }
  return cc;
}

function hideClick(p){
  const z = Math.max(zs(), scale);
  const cand = objs.filter(o => !o.given && (o.kind === 'circle' || o.kind === 'line') && distToCurve(o, p).d < 12 / z)
                   .sort((a, b) => distToCurve(a, p).d - distToCurve(b, p).d);
  if (!cand.length){ flashHint('숨기거나 다시 보이게 할 원이나 선 가까이를 눌러 주세요.'); return; }
  const o = cand[0], nv = state.vis[o.id] ? 0 : 2;
  if (nv) state.vis[o.id] = nv; else delete state.vis[o.id];
  flashHint(`${o.kind === 'circle' ? '원' : '선'}을 ${nv ? '숨겼어요. 희미하게 남은 것을 다시 누르면 보여요.' : '다시 보이게 했어요.'}`);
  draw();
}
function handleClick(p){
  if (busy || (state.tool === 'pan' && !state.skill)) return;
  if (!started){ flashHint('먼저 학번과 이름을 입력하고 [로그인]을 누르세요.'); return; }
  if (state.skill){ skillClick(p); return; }
  if (state.tool === 'hide'){ hideClick(p); return; }
  const t = state.tool;
  if (t === 'point' && !state.skill){
    const pc = pointCandidate(p, state.pointType);
    if (!pc){
      flashHint(state.pointType === 'inter' ? '교점 근처를 눌러 주세요. (선이나 원이 만나는 곳)' : '점을 찍을 선이나 원 가까이를 눌러 주세요.');
      return;
    }
    if (pc.type === 'existing'){ flashHint('이미 있는 점입니다.'); return; }
    const created = [], pt = materialize(pc, created);
    commit('point', `점 ${pt.label} 찍기 (${PTYPE_KO[pt.ptype]})`, created, {});
    refresh(); return;
  }
  const c = snapCandidate(p);
  if (t === 'point'){
    if (c.type === 'existing'){ flashHint('이미 있는 점입니다.'); return; }
    const created = [], pt = materialize(c, created);
    commit('point', `점 ${pt.label} 찍기 (${PTYPE_KO[pt.ptype]})`, created, {});
    refresh(); return;
  }
  if (t === 'compass' && state.measuring && !state.pending.length){
    // 점(기존 점·교점)을 눌렀으면 길이를 재려는 것이므로 원을 가져오지 않습니다
    const onPoint = c.type === 'existing' || c.type === 'intersection';
    const z = Math.max(zs(), scale);
    const near = onPoint ? [] : objs.filter(o => o.kind === 'circle' && distToCircle(o, p).d < 10 / z);
    if (near.length){
      const cc = near.sort((a, b) => distToCircle(a, p).d - distToCircle(b, p).d)[0];
      setWidth(cc.r, '원 ' + P(cc.center).label, [cc.center]);
      flashHint('원의 반지름을 폭으로 가져왔습니다. 이제 [원 그리기]로 돌아갑니다. 중심을 찍으세요.');
      refresh(); return;
    }
  }
  if (t === 'compass' && state.width && !state.measuring){
    if (c.type !== 'free') markPick(c);
    const created = [], o = materialize(c, created);
    const C = addObj({ kind:'circle', center:o.id, r:state.width.r, parents:[o.id, ...state.width.src], tool:'compass' });
    created.push(C.id);
    const extra0 = state.widthCost || 0;
    if (blockedBy('compass', 1 + extra0)){ removeObj(C.id); created.filter(i => i !== C.id).forEach(removeObj); return; }
    const extra = extra0; state.widthCost = 0;
    commit('compass', `고정된 폭(${state.width.name})으로 ${o.label}에 원 그리기${extra ? ' [길이 재기 포함]' : ''}${newPtsText(created.filter(i => i !== C.id))}`, created, { compass:1 + extra });
    refresh(); return;
  }
  if (state.pending.some(q => dist(q, c) < 1e-6)){ flashHint('서로 다른 점을 선택하세요.'); return; }
  state.pending.push(c);
  if (t === 'compass' || t === 'ruler') if (c.type !== 'free') markPick(c);     // 자로 선을 그을 때도 두 번째 점에 초록 표시가 남습니다
  if (t === 'ruler' && state.pending.length === 2){
    if (blockedBy('ruler')) return;
    const created = [], a = materialize(state.pending[0], created), b = materialize(state.pending[1], created);
    const L = addObj({ kind:'line', ltype:state.rulerType, p1:a.id, p2:b.id, parents:[a.id,b.id], tool:'ruler' });
    created.push(L.id);
    commit('ruler', `${RULER_KO[state.rulerType]} ${a.label}${b.label} 긋기${newPtsText(created.filter(i => i !== L.id))}`, created, { ruler:1 });
    state.pending = [];
  } else if (t === 'compass' && !state.measuring && state.pending.length === 2){
    if (blockedBy('compass')) return;
    const created = [], o = materialize(state.pending[0], created), q = materialize(state.pending[1], created);
    const C = addObj({ kind:'circle', center:o.id, r:dist(o,q), parents:[o.id,q.id], tool:'compass' });
    created.push(C.id);
    setWidth(dist(o,q), `${o.label}${q.label}`, [o.id,q.id]);
    commit('compass', `중심 ${o.label}, 반지름 ${o.label}${q.label} 인 원${newPtsText(created.filter(i => i !== C.id))}`, created, { compass:1 });
    state.pending = [];
  } else if (t === 'compass' && state.measuring && state.pending.length === 2){
    const created = [], a = materialize(state.pending[0], created), b = materialize(state.pending[1], created);
    setWidth(dist(a,b), `${a.label}${b.label}`, [a.id,b.id], true);
    state.pending = [];
    if (created.length) commit('width', `폭 ${a.label}${b.label} 재기${newPtsText(created)}`, created, {});   // 새로 찍힌 점도 되돌리기·처음부터로 지워집니다
    flashHint(`폭을 ${a.label}${b.label} 로 맞췄습니다. 이제 [원 그리기]로 돌아갑니다. 중심을 찍으세요. (같은 폭으로 여러 번 그릴 수 있습니다)`);
  }
  refresh();
}
function setWidth(r, name, src, fromMeasure){
  state.measuring = false;
  const changed = !state.width || Math.abs(state.width.r - r) > 1e-9;
  if (changed){
    state.width = { r, name, src };
    if (fromMeasure && CONFIG.COUNT_WIDTH_AS_COMPASS) state.widthCost = 1;
  }
  updateWidthBox();
}
function skillClick(p){
  const s = skill(state.skill), need = s.need[state.pending.length];
  if (problem.limit && problem.limit.skills === false){ flashHint('이 문제에서는 스킬을 쓸 수 없습니다.'); state.skill = null; renderSkills(); refresh(); return; }
  if (need === 'l'){
    const L = pickLine(p);
    if (!L){ flashHint('직선을 눌러 선택하세요.'); return; }
    state.pending.push({ type:'line', obj:L, x:p.x, y:p.y });
  } else {
    const c = snapCandidate(p);
    state.pending.push(c);
  }
  if (state.pending.length === s.need.length) runSkill(s);
  refresh();
}
function runSkill(s){
  const created = [], args = [];
  for (let i = 0; i < s.need.length; i++){
    const it = state.pending[i];
    args.push(s.need[i] === 'l' ? it.obj : materialize(it, created));
  }
  state.pending = [];
  if (blockedBy('ruler', s.cost.ruler) || blockedBy('compass', s.cost.compass)){ created.forEach(removeObj); return; }
  let steps;
  try { steps = s.run(args); } catch (e){ flashHint('이 위치에서는 사용할 수 없어요.'); refresh(); return; }
  busy = true;
  const madeIds = created.slice(), parentsBase = args.map(a => a.id);
  let last = null, i = 0;
  const tick = () => {
    if (i >= steps.length){
      busy = false;
      commit('skill', `[스킬] ${s.name} 사용 → 자 ${s.cost.ruler}, 컴퍼스 ${s.cost.compass} 환산${newPtsText(madeIds.filter(id => P(id) && P(id).kind === 'point'))}`,
             madeIds, { ruler:s.cost.ruler, compass:s.cost.compass });
      actions[actions.length - 1].skillId = s.id;
      refresh(); return;
    }
    const st = steps[i++], par = (st.parents || parentsBase).concat(st.useLast && last ? [last] : []);
    if (st.k === 'point'){
      const pt = mkPoint(st.x, st.y, par, madeIds, 'intersection');
      last = pt.id;
    } else if (st.k === 'circle'){
      const c = mkPoint(st.cx, st.cy, par, madeIds, 'intersection');
      const C = addObj({ kind:'circle', center:c.id, r:st.r, parents:par.concat([c.id]), tool:'skill' });
      madeIds.push(C.id); last = C.id;
    } else if (st.k === 'line'){
      const a = mkPoint(st.ax, st.ay, par, madeIds, 'intersection');
      const b = mkPoint(st.bx, st.by, par, madeIds, 'intersection');
      const L = addObj({ kind:'line', ltype:st.ltype, p1:a.id, p2:b.id, parents:par.concat([a.id,b.id]), tool:'skill' });
      madeIds.push(L.id); last = L.id;
    }
    draw();
    setTimeout(tick, 260);
  };
  tick();
}
function undo(){
  if (busy) return;
  clearGhost();
  if (state.pending.length){ state.pending = []; refresh(); return; }
  const a = actions.pop();
  if (!a){ flashHint('되돌릴 작도가 없어요.'); return; }
  const kept = a.ids.map(id => P(id)).filter(Boolean);   // 앞으로 가기를 위해 그대로 보관합니다
  a.ids.forEach(removeObj);
  const le = log.find(l => l.seq === a.seq); if (le) le.removedBy = '되돌림';
  redoStack.push({ action:a, objects:kept });
  stats.undo++; addLog('undo', '실행 취소');
  state.highlight = null; hideMsg(); refresh();
}
// 되돌린 작도를 다시 살립니다. 새로 작도하면 앞으로 갈 자리는 사라집니다.
function redo(){
  if (busy) return;
  clearGhost();
  const r = redoStack.pop();
  if (!r){ flashHint('앞으로 갈 작도가 없어요.'); return; }
  r.objects.forEach(o => { if (!M.has(o.id)){ objs.push(o); M.set(o.id, o); } });
  objs.sort((x, y) => x.id - y.id);
  actions.push(r.action);
  const le = log.find(l => l.seq === r.action.seq); if (le) le.removedBy = null;
  stats.redo++; addLog('redo', '재실행');
  state.pending = []; state.highlight = null; hideMsg(); refresh();
}
async function resetWork(){
  if (busy) return;
  if (state.needSubmit && blockedBySubmit()) return;   // 제출 전에는 작도 결과를 지울 수 없습니다
  if (!actions.length && !state.pending.length) return;
  state.pending = [];
  actions.forEach(a => { a.ids.forEach(removeObj); const le = log.find(l => l.seq === a.seq); if (le && !le.removedBy) le.removedBy = '처음부터'; });
  objs.filter(o => !o.given).forEach(o => removeObj(o.id));   // 기록에 남지 않은 점까지 모두 지웁니다
  clearGhost(); actions = []; redoStack = []; stats.reset++; state.vis = {}; addLog('reset', '처음부터');
  state.width = null; state.widthCost = 0; state.measuring = false; state.highlight = null; hideMsg(); refresh();
}

// ===================== 채점과 점수 =====================
// 표준 해법으로 풀 때 드는 작도 횟수 (자 + 컴퍼스, 폭 설정은 세지 않음)
// 스킬을 쓰면 그 스킬의 환산 횟수로 계산되므로 기준은 같습니다.
function standardCost(pr){
  const m = { A1:1, A2:4, A3:3, A4:3, A5:4, A6:2, A7:4, A8:4,   // 기본 작도
              B1:4, B2:6, B3:7, B4:9,                            // 연습 문제
              C1:4, D1:4, D2:7,                                  // 평행선 · 심화
              E1:5, E2:13 };                                     // 도전
  return m[pr.id] || 4;
}
function finalScore(){ return progress.score; }   // 코인은 점수에 반영하지 않습니다
function baseScore(){
  if (problem.score) return problem.score;
  return state.stage === 'practice' ? SCORE.practice : state.stage === 'step1' ? SCORE.step1 : SCORE.step2;
}
function onCheck(){
  if (busy) return;
  stats.check++; renderHints();
  const r = problem.check(G);
  addLog('check', r.ok ? '작도 확인: 성공' : '작도 확인: 미완성');
  if (!r.ok){ showMsg(r.msg, 'info'); refresh(); return; }

  const mc = meaningfulCount(r.ids), tot = totals();
  state.highlight = ancestors(r.ids);
  const strat = problem.strategy ? classify(r.ids, G) : '';
  const already = !!progress.solved[problem.id];
  let gained = 0, why = [], secondOk = false;

  if (already && problem.strategy && strat && !progress.strategies.includes(strat)){
    secondOk = true;
    gained += SCORE.second; why.push(`다른 계열의 방법 +${SCORE.second}`);
    progress.strategies.push(strat);
  }
  if (!already){
    const base = baseScore();
    gained += base; why.push(`성공 +${base}`);
    const min = standardCost(problem), used = mc.total;
    if (used <= min){ gained += SCORE.minimal; why.push(`최소 횟수 +${SCORE.minimal}`); }
    else if (used <= min + 2){ gained += SCORE.nearMinimal; why.push(`최소 횟수 +2회 이내 +${SCORE.nearMinimal}`); }
    if (stats.check === 1){ gained += SCORE.firstTry; why.push(`한 번에 통과 +${SCORE.firstTry}`); }
    if (problem.strategy && mc.compass <= 2 && mc.ruler <= 1){ gained += SCORE.badge; why.push(`최소 작도 배지 +${SCORE.badge}`); }
    if (strat && !progress.strategies.includes(strat)) progress.strategies.push(strat);
    progress.solved[problem.id] = true;
    if (problem.skill && !hasSkill(problem.skill)) progress.skills.push(problem.skill);
  }
  if (gained){
    progress.score += gained;
    progress.records.push({
      id:already ? problem.id + '-2' : problem.id,
      title:already ? problem.title + ' (다른 방법)' : problem.title,
      stage:STAGE_KO[state.stage] || state.stage, solved:'O', sec:elapsed(),
      ruler:tot.ruler, compass:tot.compass, rulerM:mc.ruler, compassM:mc.compass,
      rulerX:tot.ruler - mc.ruler, compassX:tot.compass - mc.compass,
      width:0,   // 구글 시트의 '폭 설정' 열이 비지 않도록 0으로 보냅니다(폭 설정은 더 이상 세지 않습니다)
      undo:stats.undo, redo:stats.redo, reset:stats.reset, check:stats.check,
      hints:stats.hintsUsed.map(l => l + 1).join(','), score:gained, strategy:strat
    });
  }

  const ur = tot.ruler - mc.ruler, uc = tot.compass - mc.compass;
  let txt = `<div class="rs"><div class="rs-t">🎉 ${r.msg}</div>`;
  if (strat) txt += `<div class="rs-m">사용한 방법 <b>${strat}</b></div>`;
  if (gained){
    txt += `<div class="rs-sc"><span class="rs-big">+${gained}<small>점</small></span><span class="rs-chips">${why.map(w => `<span class="chip">${w}</span>`).join('')}</span></div>`;
  } else {
    txt += `<div class="rs-m">이미 점수를 받은 문제입니다.</div>`;
  }
  txt += `<div class="rs-m">정답에 쓰인 작도 <b>눈금 없는 자 ${mc.ruler} · 컴퍼스 ${mc.compass}</b> (합계 ${mc.total}회 · 최소 횟수 ${standardCost(problem)}회)`;
  if (ur + uc > 0) txt += `<br>쓰이지 않은 작도 눈금 없는 자 ${ur} · 컴퍼스 ${uc} (흐리게 표시)`;
  txt += `</div>`;
  if (gained && problem.skill && !already) txt += `<div class="rs-sk">✨ <b>${skill(problem.skill).name}</b> 스킬을 얻었습니다</div>`;
  txt += `</div>`;
  if (gained){
    state.needSubmit = true;
    txt = txt.replace(/<\/div>$/, `<div class="rs-sub">👉 <b>[제출하기]</b>를 눌러야 점수가 선생님께 전달돼요. 제출하면 다른 문제로 갈 수 있어요.</div></div>`);
  }
  showMsg(txt, 'ok');
  updateSubmitNudge();
  renderAll(); draw();
}

// 문제마다 작도 단계 수만큼 힌트가 있습니다. [힌트]를 누를 때마다 코인을 쓰고 다음 힌트를 봅니다.
function hintCost(lv){ return HINT_COST; }
// 지금까지 그린 작도를 표준 해법과 견주어, 처음 보여 줄 힌트 번호를 고릅니다.
// (이미 끝낸 단계의 힌트는 건너뛰고, 아직 안 한 첫 단계의 힌트부터 보여 줍니다)
function smartStart(){
  const list = stepHints(problem), n = list.length;
  const steps = problem && problem.solve ? problem.solve(G) : [];
  const an = analyzeWork(steps);
  const isDone = h => h.g != null && steps[h.g] && an.done[h.g];
  let lastDone = -1;
  list.forEach((h, i) => { if (isDone(h)) lastDone = i; });
  if (lastDone < 0) return 0;                                   // 아직 표준 해법 단계를 하나도 안 했다면 처음부터
  for (let i = lastDone + 1; i < n; i++) if (!isDone(list[i])) return i;
  return n - 1;                                                  // 모든 단계를 끝냈다면 마지막 힌트
}
function hintCount(){ return stepHints(problem).length; }
function nextHintLv(){
  const n = hintCount();
  for (let lv = 0; lv < n; lv++) if (!stats.hintsUsed.includes(lv)) return lv;
  return -1;
}

function hintBlockReason(){

}
function useHint(lv, note){
  if (busy) return;
  if (lv < 0 || lv >= hintCount()) return;
  if (stats.hintsUsed.includes(lv)){ showHint(lv); return; }
  const blk = hintBlockReason();
  if (blk){ showMsg(blk, 'info'); return; }
  if (stats.check < 1){                                      // 힌트는 [작도 확인]을 한 번 눌러 본 뒤부터 — 힌트대로 그려 '한 번에 통과'를 받는 것을 막습니다
    showMsg('힌트는 <b>[작도 확인]</b>을 한 번 눌러 본 뒤에 쓸 수 있어요.<br>지금까지 그린 작도를 먼저 확인해 보세요.', 'warn'); return; }
  const cost = hintCost(lv);
  if (progress.coins < cost){
    showMsg(`코인이 모자랍니다. (남은 코인 ${progress.coins}개)`, 'warn'); return; }
  progress.coins -= cost;
  stats.hintsUsed.push(lv);
  progress.hints.push({ id:problem.id, lv, t:elapsed(), cost });
  addLog('hint', `힌트 ${lv + 1}단계 사용 (코인 ${cost}개)`);
  showHint(lv, note); renderAll();
}
let ghostTimer = null;
function clearGhost(){ if (state.ghost){ state.ghost = null; clearTimeout(ghostTimer); draw(); } }
// ===== 학생이 그린 작도와 표준 풀이를 맞춰 보기 =====
// 표준 풀이는 반지름 같은 값을 하나로 정해 둔 것이라, 학생이 다르게 그렸다면 그 그림에 맞게 뒤 단계를 다시 계산합니다.
function geomDist(g, p){
  if (g.t === 'c') return Math.abs(dist(p, g.c) - g.r);
  const dx = p.x - g.a.x, dy = p.y - g.a.y, d = Math.abs(dx*g.u.y - dy*g.u.x), t = dx*g.u.x + dy*g.u.y;
  if (g.type === 'ray' && t < -1) return 9999;
  if (g.type === 'segment' && (t < -1 || t > Math.hypot(g.b.x - g.a.x, g.b.y - g.a.y) + 1)) return 9999;
  return d;
}
function alignGeom(act, std){             // 학생이 반대 방향으로 그은 선도 같은 방향으로 맞춥니다
  if (act.t === 'l' && std.t === 'l' && act.type !== 'ray' && act.u.x*std.u.x + act.u.y*std.u.y < 0)
    return { t:'l', a:act.b, b:act.a, u:{ x:-act.u.x, y:-act.u.y }, type:act.type };
  return act;
}
function analyzeWork(steps){
  const givenPts = objs.filter(o => o.kind === 'point' && o.given).map(o => P(o.id));
  const isGiven = p => givenPts.some(q => dist(q, p) < 1);
  const curves = [];                                         // { std: 표준 해법의 모양, act: 학생(또는 학생에게 맞춘) 모양 }
  for (const o of objs) if (o.given && (o.kind === 'line' || o.kind === 'circle')){ const g = objGeom(o); curves.push({ std:g, act:g }); }
  const pairInts = (ca, cb) => {
    const S = geomInt(ca.std, cb.std), A = geomInt(alignGeom(ca.act, ca.std), alignGeom(cb.act, cb.std));
    return { S, A };
  };
  // 표준 풀이의 점 p 에 해당하는 학생 그림 속의 점
  const analog = p => {
    if (isGiven(p)) return { pt:p, ok:true };
    for (let i = 0; i < curves.length; i++) for (let j = i + 1; j < curves.length; j++){
      const ca = curves[i], cb = curves[j];
      if (geomDist(ca.std, p) > 1 || geomDist(cb.std, p) > 1) continue;
      const { S, A } = pairInts(ca, cb);
      if (!S.length || A.length !== S.length) continue;
      let idx = 0, best = 1e9;
      S.forEach((q, k) => { const d = dist(q, p); if (d < best){ best = d; idx = k; } });
      return { pt:A[idx], ok:true };
    }
    return { pt:p, ok:false };
  };
  const out = { adapted:[], act:[], obj:[], done:[], need:[], marks:(problem && problem.marks) ? problem.marks(G) : [] };
  const used = new Set(), radii = [];
  steps.forEach((st, i) => {
    let ad = st, matchObj = null, need = [];
    if (st.k === 'circle'){
      const c = analog(st.c);
      let r = st.r, fixed = false;
      outer1: for (let a = 0; a < givenPts.length; a++) for (let b = a + 1; b < givenPts.length; b++)
        if (Math.abs(dist(givenPts[a], givenPts[b]) - st.r) < 0.02){ fixed = true; break outer1; }
      if (!fixed){
        const j = radii.findIndex(x => x && Math.abs(x.std - st.r) < 0.02);
        if (j >= 0){ r = radii[j].act; fixed = true; }
      }
      if (!fixed){                                           // 두 점 사이의 거리를 재어 쓰는 반지름
        const cands = givenPts.map(p => ({ s:p, a:p, g:true }));
        for (let x = 0; x < curves.length; x++) for (let y = x + 1; y < curves.length; y++){
          const { S, A } = pairInts(curves[x], curves[y]);
          if (S.length && S.length === A.length) S.forEach((q, k) => cands.push({ s:q, a:A[k], g:false }));
        }
        search: for (let x = 0; x < cands.length; x++) for (let y = x + 1; y < cands.length; y++){
          if (cands[x].g && cands[y].g) continue;
          if (Math.abs(dist(cands[x].s, cands[y].s) - st.r) < 0.02){
            r = dist(cands[x].a, cands[y].a); fixed = true;
            if (!cands[x].g) need.push(cands[x].a);
            if (!cands[y].g) need.push(cands[y].a);
            break search;
          }
        }
      }
      ad = { k:'circle', c:c.pt, r };
      matchObj = objs.find(o => o.kind === 'circle' && !o.given && !used.has(o.id) &&
        dist(P(o.center), c.pt) < 1 && (!fixed || Math.abs(o.r - r) < 1)) || null;
    } else if (st.k === 'line'){
      const a = analog(st.a), b = analog(st.b);
      ad = { k:'line', a:a.pt, b:b.pt, ltype:st.ltype };
      if (a.ok || b.ok)
        matchObj = objs.find(o => o.kind === 'line' && !o.given && !used.has(o.id) &&
          (!a.ok || onCurve(o, a.pt, 1)) && (!b.ok || onCurve(o, b.pt, 1))) || null;
    }
    if (matchObj) used.add(matchObj.id);
    const act = matchObj ? objGeom(matchObj) : stepGeom(ad);
    out.adapted[i] = ad; out.obj[i] = matchObj; out.done[i] = !!matchObj; out.need[i] = need; out.act[i] = act;
    radii[i] = st.k === 'circle' ? { std:st.r, act:act.r } : null;
    curves.push({ std:stepGeom(st), act });
  });
  out.givenGeoms = objs.filter(o => o.given && (o.kind === 'line' || o.kind === 'circle')).map(objGeom);
  return out;
}
// 이 단계 뒤에 실제로 쓰이는 점(뒤 단계의 중심·끝점, 길이를 재는 데 쓰는 점, 문제의 답)
function wantedPoints(an, steps, idx){
  const out = an.marks.slice();
  for (let j = idx + 1; j < steps.length; j++){
    const ad = an.adapted[j];
    if (ad.k === 'circle') out.push(ad.c); else if (ad.k === 'line'){ out.push(ad.a); out.push(ad.b); }
    an.need[j].forEach(q => out.push(q));
  }
  return out;
}
// 이 단계를 그릴 때 새로 생기는 교점 중 앞으로 쓰일 것만 — '여기를 찍으세요' 표시로 씁니다
function isGivenPt(p){ return objs.some(o => o.kind === 'point' && o.given && dist(o, p) < 1); }
function ghostPoints(idx, steps, an, noExist){
  an = an || analyzeWork(steps);
  const cur = stepGeom(an.adapted[idx]);
  if (!cur) return [];
  const want = wantedPoints(an, steps, idx);
  const others = an.givenGeoms.slice();
  for (let j = 0; j < idx; j++) others.push(an.act[j]);
  const vs = viewSize(), v = state.view, k = v.k;
  const x0 = (-v.x)/k, y0 = (-v.y)/k;
  const out = [];
  // ① 이 단계를 그리려면 먼저 있어야 하는 점(원의 중심, 선의 두 점, 길이를 재는 점) 중 아직 안 찍은 것
  const own = [], ownTag = [];
  const ad = an.adapted[idx];
  if (ad.k === 'circle'){ own.push(ad.c); ownTag.push('중심'); }
  else if (ad.k === 'line'){ own.push(ad.a); ownTag.push('여기'); own.push(ad.b); ownTag.push('여기'); }
  an.need[idx].forEach(q => { own.push(q); ownTag.push('여기'); });
  const inView = q => isFinite(q.x) && isFinite(q.y) && !(q.x < x0 - 20 || q.x > x0 + vs.w/k + 20 || q.y < y0 - 20 || q.y > y0 + vs.h/k + 20);
  for (let a = 0; a < others.length; a++) for (let b = a + 1; b < others.length; b++){
    for (const q of geomInt(others[a], others[b])){
      if (!inView(q) || !own.some(w => dist(w, q) < 1.5)) continue;
      if (out.some(w => dist(w, q) < 1.5)) continue;
      if (objs.some(o => o.kind === 'point' && !o.hidden && dist(o, q) < 1.5)) continue;
      out.push(q);
    }
  }
  // ①-2 이미 찍어 둔 점이라도, 이 단계에서 '그 점'으로 쓰이는 것은 어느 점인지 표시합니다 (주어진 점은 이름이 있으니 제외)
  if (!noExist) own.forEach((w, i) => {
    if (isGivenPt(w)) return;
    const ex = objs.find(o => o.kind === 'point' && !o.hidden && !o.given && dist(o, w) < 1.5);
    if (ex && inView(ex) && !out.some(q => dist(q, w) < 1.5)) out.push({ x:ex.x, y:ex.y, exist:true, tag:ownTag[i] });
  });
  // ② 이 단계를 그리면 새로 생기는 교점 중 앞으로 쓰일 것
  for (const g of others){
    for (const q of geomInt(cur, g)){
      if (!isFinite(q.x) || !isFinite(q.y)) continue;
      if (!want.some(w => dist(w, q) < 1.5)) continue;       // 앞으로 쓰이지 않는 교점은 보여 주지 않습니다
      if (q.x < x0 - 20 || q.x > x0 + vs.w/k + 20 || q.y < y0 - 20 || q.y > y0 + vs.h/k + 20) continue;
      if (out.some(w => dist(w, q) < 1.5)) continue;
      if (objs.some(o => o.kind === 'point' && !o.hidden && dist(o, q) < 1.5)) continue;
      out.push(q);
      if (out.length >= 4) return out;
    }
  }
  return out;
}
// 그 단계에서 그릴 것을 점선으로, 새로 생기는 점을 반투명 동그라미로 보여 줍니다
function drawGhostHint(lv){
  const list = stepHints(problem), h = list[lv];
  state.ghost = null;
  if (!h) return false;
  const steps = problem.solve ? problem.solve(G) : [];
  const an = analyzeWork(steps);
  let ghost = null;
  if (h.g != null && steps[h.g]){
    ghost = [an.adapted[h.g]].concat(ghostPoints(h.g, steps, an).map(q => ({ k:'point', x:q.x, y:q.y, exist:q.exist, tag:q.tag })));
  } else if (/찍/.test(h.t) && lv > 0 && list[lv-1].g != null && steps[list[lv-1].g]){
    // 앞 단계에서 그린 것 위에 '찍을 자리'만 보여 줍니다
    const pts = ghostPoints(list[lv-1].g, steps, an, true);
    if (pts.length) ghost = pts.map(q => ({ k:'point', x:q.x, y:q.y }));
  }
  if (!ghost || !ghost.length) return false;
  state.ghost = ghost;                                       // 힌트를 닫거나 새로 작도하기 전까지 계속 보입니다
  draw();
  return true;
}
function closeHint(){
  const pane = document.getElementById('hintPane');

function showHint(lv, note){
  const list = stepHints(problem), n = list.length;
  lv = Math.max(0, Math.min(n - 1, lv));
  state.hintAt = lv;
  const pane = document.getElementById('hintPane');
  const drew = drawGhostHint(lv);
  hideMsg();
  pane.innerHTML =
    `<div class="hd"><b>힌트 ${lv+1}</b>` +
    `<button class="x" id="btnHintClose" title="힌트 닫기">✕</button></div>` +
    `<div class="bd">${list[lv].t}</div>` +
    (note ? `<div class="note">${note}</div>` : '');
  pane.classList.add('show');
  document.getElementById('btnHintClose').onclick = closeHint;
  renderHints();
}

const STAGE_KO = { step1:'1 기본 작도', practice:'1.5 기본 작도 연습', step2:'2 평행선 작도', bonus:'2.5 평행선 작도 심화', step3:'3 도전 문제' };
function buildPayload(auto){
  const tot = totals();
  return {
    submissionId:'S' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    clientTime:new Date().toLocaleString('ko-KR'),

    name:document.getElementById('sname').value.trim(),
    stage:STAGE_KO[state.stage] || state.stage,

    score:progress.score,
    coins:progress.coins,
    exchangedCoins:progress.exchanged,
    coinBonus:0,
    finalScore:finalScore(),

    hints:progress.hints.slice(progress.sentHint),
    log:log.filter(l => l.seq > (state.logSent || 0)).map(l => ({ seq:l.seq, t:l.t, kind:l.kind, detail:l.detail, status:l.removedBy || '' })),
    problemId:problem ? problem.id : '',
    image:CONFIG.SEND_IMAGE ? exportImage(null) : ''
  };
}
async function submit(auto){
  const sid = document.getElementById('sid').value.trim(), nm = document.getElementById('sname').value.trim();
  if (!sid || !nm){ if (!auto) showMsg('학번과 이름을 먼저 입력하세요.', 'err'); return; }
  if (progress.sentRec >= progress.records.length && !state.needSubmit){ if (!auto) showMsg('아직 제출할 기록이 없습니다.', 'err'); return; }
  const payload = buildPayload(auto), nRec = progress.records.length, nHint = progress.hints.length, lastSeq = seq;
  if (!/^https:\/\/script\.google\.com\//.test(CONFIG.SCRIPT_URL)){
    showMsg('선생님 설정 필요: SCRIPT_URL이 비어 있습니다.', 'err'); return; }
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true; if (!auto) showMsg('제출 중입니다…', 'info');
  const r = await sendData(payload);
  btn.disabled = false;
  if (r.ok){ progress.submitted++; progress.sentRec = nRec; progress.sentHint = nHint; state.logSent = lastSeq; state.needSubmit = false; updateSubmitNudge(); showMsg(`✅ 제출 완료 — 문제 ${payload.solvedCount}개 · 작도 점수 <b>${payload.finalScore}점</b>`, 'ok'); }
  else { showMsg('제출에 실패했습니다. 다시 눌러 주세요.<br><small>' + r.reason + '</small>', 'err'); downloadBackup(payload); }
}
async function sendData(payload){
  const body = JSON.stringify(payload);
  let res;
  try { res = await fetch(CONFIG.SCRIPT_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body, redirect:'follow' }); }
  catch (e){ console.error(e); return { ok:false, reason:'서버에 연결하지 못했습니다. (웹 앱 액세스 권한 확인)' }; }
  const text = await res.text();
  let j = null; try { j = JSON.parse(text); } catch (e){}
  if (!j){ console.error('non-JSON', res.status, text.slice(0,300)); return { ok:false, reason:'서버 응답이 올바르지 않습니다. (배포 주소·권한 확인)' }; }
  return j.result === 'success' ? { ok:true } : { ok:false, reason:'서버 오류: ' + (j.message || '') };
}
function downloadBackup(payload){
  try {
    const copy = Object.assign({}, payload, { image:'(생략)' });
    const blob = new Blob([JSON.stringify(copy, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `작도기록_${payload.studentId}_${payload.name}.json`;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e){}
}

// ===================== 그리기 =====================
function lineEnds(ax, ay, bx, by, type){
  const dx = bx - ax, dy = by - ay, T = 9000 / Math.hypot(dx, dy);
  if (type === 'segment') return [{x:ax,y:ay},{x:bx,y:by}];
  if (type === 'ray') return [{x:ax,y:ay},{x:ax+T*dx,y:ay+T*dy}];
  return [{x:ax-T*dx,y:ay-T*dy},{x:ax+T*dx,y:ay+T*dy}];
}
function drawScene(c, s, hl, box, forSubmit){
  const px = v => v / s;
  const b = box || { x:0, y:0, w:W, h:H };
  c.fillStyle = '#FBFDFF'; c.fillRect(b.x, b.y, b.w, b.h);
  // 제도용지 모눈
  c.strokeStyle = 'rgba(37,99,235,.09)'; c.lineWidth = px(1);
  const g = 50, x0 = Math.floor(b.x/g)*g, y0 = Math.floor(b.y/g)*g;
  c.beginPath();
  for (let x = x0; x <= b.x + b.w; x += g){ c.moveTo(x, b.y); c.lineTo(x, b.y + b.h); }
  for (let y = y0; y <= b.y + b.h; y += g){ c.moveTo(b.x, y); c.lineTo(b.x + b.w, y); }
  c.stroke();
  // 테두리는 제출용 그림에만 그립니다.
  // (화면에서는 축소할 때 네모 박스처럼 보여 작도를 방해합니다)
  if (!box){
    c.strokeStyle = 'rgba(37,99,235,.28)'; c.lineWidth = px(1.5);
    c.strokeRect(0, 0, W, H);
  }
  // 학생이 고른 원·선은 숨김(2). 숨기기 도구를 쓰는 동안은 숨긴 것도 아주 희미하게 보여서 다시 누를 수 있습니다. 제출용 그림에는 적용하지 않습니다
  const visAlpha = o => {
    if (forSubmit || o.given) return null;
    const v = state.vis[o.id]; if (!v) return null;
    return state.tool === 'hide' ? 0.16 : 0;
  };
  const alphaFor = o => (hl && !o.given && !hl.has(o.id)) ? 0.18 : 1;
  const strong = o => hl && hl.has(o.id);
  for (const o of objs) if (o.kind === 'circle'){
    const g = circGeom(o);
    const va = visAlpha(o); if (va === 0) continue;
    c.globalAlpha = va != null ? va : alphaFor(o); c.strokeStyle = o.given ? COL.given : COL.compass; c.lineWidth = px(o.given ? 2.4 : (strong(o) ? 2.4 : 1.5));
    c.beginPath(); c.arc(g.x, g.y, g.r, 0, Math.PI*2); c.stroke();
  }
  for (const o of objs) if (o.kind === 'line'){
    const a = P(o.p1), b = P(o.p2), e = lineEnds(a.x, a.y, b.x, b.y, o.ltype);
    const va = visAlpha(o); if (va === 0) continue;
    c.globalAlpha = va != null ? va : alphaFor(o); c.strokeStyle = o.given ? COL.given : COL.ruler;
    c.lineWidth = px(o.given ? 2.6 : (strong(o) ? 3 : 2));
    c.beginPath(); c.moveTo(e[0].x, e[0].y); c.lineTo(e[1].x, e[1].y); c.stroke();
    if (o.text){
      const at = o.textAt || { x:(a.x+b.x)/2, y:(a.y+b.y)/2 - 10 };
      c.fillStyle = '#111'; c.font = `italic bold ${px(18)}px serif`; c.fillText(o.text, at.x, at.y);
    }
  }
  for (const o of objs) if (o.kind === 'point' && !o.hidden){
    c.globalAlpha = alphaFor(o); c.fillStyle = PCOL[o.ptype];
    c.beginPath(); c.arc(o.x, o.y, px(o.given ? 4.5 : 4), 0, Math.PI*2); c.fill();
    if (state.showLabels && !o.noLabel && o.label){
      c.font = `${o.given ? 'bold ' : ''}${px(15)}px sans-serif`;
      c.fillStyle = o.given ? '#111' : '#374151';
      c.fillText(o.label, o.x + px(7), o.y - px(7));
    }
  }
  c.globalAlpha = 1;
}
function ring(c, p, r, color, s){
  c.strokeStyle = color; c.lineWidth = 2 / s;
  c.beginPath(); c.arc(p.x, p.y, r / s, 0, Math.PI*2); c.stroke();
}
function drawGhost(c, s){
  if (!state.ghost) return;
  const px = v => v / s;
  c.save(); c.setLineDash([px(9), px(6)]); c.lineWidth = px(2.4); c.strokeStyle = COL.hint;
  for (const st of state.ghost){

const PICK_MS = 2500;
let picks = [], pickRaf = 0;
function markPick(c){
  picks.push({ x:c.x, y:c.y, t:performance.now() });
  if (!pickRaf) pickRaf = requestAnimationFrame(pickTick);
}
function pickTick(){
  const now = performance.now();
  picks = picks.filter(q => now - q.t < PICK_MS);
  draw();
  pickRaf = picks.length ? requestAnimationFrame(pickTick) : 0;
}
function drawPreview(c, s){
  const px = v => v / s, sn = state.snap, pend = state.pending, t = state.tool;
  c.save(); c.setLineDash([px(6), px(5)]); c.lineWidth = px(1.6);
  if (sn && !state.skill){
    if (t === 'ruler' && pend.length === 1 && dist(pend[0], sn) > 1e-6){
      const e = lineEnds(pend[0].x, pend[0].y, sn.x, sn.y, state.rulerType);
      c.strokeStyle = COL.ruler; c.beginPath(); c.moveTo(e[0].x, e[0].y); c.lineTo(e[1].x, e[1].y); c.stroke();
    }
    if (t === 'compass' && !state.measuring && pend.length === 1){
      c.strokeStyle = COL.compass; c.beginPath(); c.arc(pend[0].x, pend[0].y, dist(pend[0], sn), 0, Math.PI*2); c.stroke();
    }
    if (t === 'compass' && state.measuring && pend.length === 1){
      c.strokeStyle = COL.compass; c.beginPath(); c.moveTo(pend[0].x, pend[0].y); c.lineTo(sn.x, sn.y); c.stroke();
    }
    if (t === 'compass' && !state.measuring && !pend.length && state.width){
      c.strokeStyle = COL.compass; c.beginPath(); c.arc(sn.x, sn.y, state.width.r, 0, Math.PI*2); c.stroke();
    }
  }
  c.setLineDash([]);
  // 이미 있는 점을 고르면 초록 원, 임의의 점을 직접 찍으면 그 자리에 실제 검정 점이 바로 찍힙니다
  pend.forEach(q => {
    if (q.type === 'line') return;
    if (q.type === 'free'){ c.fillStyle = '#000000'; c.beginPath(); c.arc(q.x, q.y, 4 / s, 0, Math.PI*2); c.fill(); }
    else ring(c, q, 9, '#059669', s);
  });
  if (picks.length){
    const now = performance.now();
    picks.forEach(q => {
      const age = now - q.t;
      if (age >= PICK_MS || pend.some(o => o.type !== 'line' && dist(o, q) < 1e-6)) return;
      c.globalAlpha = age < PICK_MS - 600 ? 1 : (PICK_MS - age) / 600;
      ring(c, q, 9, '#059669', s);
      c.globalAlpha = 1;
    });
  }
  if (sn){
    const colr = { existing:'#059669', intersection:'#E11D48', on:'#7C3AED', free:'#000000' }[sn.type];
    ring(c, sn, sn.type === 'free' ? 5 : 11, state.skill ? '#7c3aed' : colr, s);
  }
  c.restore();
}
function draw(){
  const k = state.view.k, v = state.view;
  ctx.setTransform(dpr*scale*k, 0, 0, dpr*scale*k, dpr*scale*v.x, dpr*scale*v.y);
  // 지금 화면에 보이는 작도판 영역
  const wCss = cv.width / dpr, hCss = cv.height / dpr;
  const box = { x:(-v.x)/k - 40, y:(-v.y)/k - 40, w:(wCss/scale)/k + 80, h:(hCss/scale)/k + 80 };
  drawScene(ctx, zs(), state.highlight, box);
  drawGhost(ctx, zs());
  drawPreview(ctx, zs());
}
function exportImage(hl){
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  drawScene(c.getContext("2d"), 1, hl, null, true);

}
let lastW = 0, lastH = 0, resizeQueued = false, baseY = 0, baseX = 0;
// 처음 보는 자리 — 작도판(가로 1000)을 화면 너비에 맞추고 세로는 가운데에 둡니다
function baseView(){ return { x:baseX, y:baseY, k:1 }; }
function atBase(){
  const v = state.view;
  return Math.abs(v.k - 1) < 1e-9 && Math.abs(v.x - baseX) < 0.5 && Math.abs(v.y - baseY) < 0.5;
}
function resize(){
  const wrap = document.querySelector('.boardwrap');
  if (!wrap) return;
  const wide = window.matchMedia('(min-width:1051px)').matches;
  const availW = wrap.clientWidth, availH = wrap.clientHeight;
  if (availW < 10) return;
  // 가로는 늘 꽉 채우고, 넓은 화면에서는 세로도 칸 전체를 채웁니다 (빈 여백 없음)
  const w = Math.round(availW);
  const h = Math.round((wide && availH > 10) ? availH : availW * H / W);
  const wasBase = atBase();
  if (Math.abs(w - lastW) < 0.5 && Math.abs(h - lastH) < 0.5) return;
  lastW = w; lastH = h;
  dpr = window.devicePixelRatio || 1;
  // 왼쪽 위의 스킬 가방에 가려지지 않도록 작도판의 원점을 오른쪽으로 조금 옮깁니다
  const margin = wide ? 66 : 52;
  scale = (w - margin) / W; baseX = margin / scale;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  baseY = Math.max(0, (h / scale - H) / 2);      // 남는 세로 공간을 위아래로 나눕니다
  if (wasBase) state.view = baseView();
  draw();
}
function queueResize(){            // 되먹임을 막기 위해 다음 그리기 차례에 처리합니다
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => { resizeQueued = false; resize(); });
}

// ===================== 이벤트 =====================
function evtPoint(e){
  const r = cv.getBoundingClientRect(), v = state.view;
  return { x:((e.clientX - r.left)/scale - v.x)/v.k, y:((e.clientY - r.top)/scale - v.y)/v.k };
}
// 확대·축소 (cx, cy 는 캔버스 안의 CSS 픽셀 좌표)
function zoomAt(f, cx, cy){
  const v = state.view, nk = Math.min(4, Math.max(0.35, v.k * f));
  if (Math.abs(nk - v.k) < 1e-6) return;
  const wx = (cx/scale - v.x)/v.k, wy = (cy/scale - v.y)/v.k;
  v.k = nk; v.x = cx/scale - wx*nk; v.y = cy/scale - wy*nk;
  draw(); updateViewLabel();
}
function viewSize(){ return { w:(cv.width/dpr)/scale, h:(cv.height/dpr)/scale }; }
function resetView(){ state.view = baseView(); draw(); updateViewLabel(); }
// 지금 그린 것이 모두 들어오도록 맞춥니다
function bounds(m = 30){
  let x0 = 0, y0 = 0, x1 = W, y1 = H;
  for (const o of objs){
    if (o.kind === 'point' && !o.hidden){ x0 = Math.min(x0, o.x); x1 = Math.max(x1, o.x); y0 = Math.min(y0, o.y); y1 = Math.max(y1, o.y); }
    else if (o.kind === 'circle'){
      const c = P(o.center);
      x0 = Math.min(x0, c.x - o.r); x1 = Math.max(x1, c.x + o.r);
      y0 = Math.min(y0, c.y - o.r); y1 = Math.max(y1, c.y + o.r);
    }
  }
  return { x0:x0 - m, y0:y0 - m, x1:x1 + m, y1:y1 + m };
}
// 전체 보기: 처음 화면의 크기 그대로 보여 주고, 그린 것이 밖으로 나갔을 때만 줄여서 모두 보여 줍니다
function fitView(){
  const vs = viewSize(), base = baseView(), b0 = bounds(0);
  const inside = b0.x0 >= -base.x - 1 && b0.x1 <= vs.w - base.x + 1 && b0.y0 >= -base.y - 1 && b0.y1 <= vs.h - base.y + 1;
  if (inside){ state.view = baseView(); draw(); updateViewLabel(); return; }
  const b = bounds(30), bw = b.x1 - b.x0, bh = b.y1 - b.y0;
  const k = Math.max(0.2, Math.min(1, Math.min(vs.w / bw, vs.h / bh)));
  state.view = { k, x:vs.w/2 - ((b.x0 + b.x1)/2) * k, y:vs.h/2 - ((b.y0 + b.y1)/2) * k };
  draw(); updateViewLabel();
}
function warnOutside(){
  if (stats.outWarned) return;
  const v = state.view, k = v.k, b = bounds(), vs = viewSize();
  const vx0 = (-v.x)/k, vy0 = (-v.y)/k, vx1 = vx0 + vs.w/k, vy1 = vy0 + vs.h/k;
  if (b.x0 < vx0 || b.y0 < vy0 || b.x1 > vx1 || b.y1 > vy1){
    stats.outWarned = true;
    flashHint('작도한 것이 화면 밖으로 나갔습니다. [전체 보기]를 누르면 모두 보입니다.');
  }
}
function updateViewLabel(){
  const el = document.getElementById('viewPct');
  if (el) el.textContent = atBase() ? '' : ` (${Math.round(state.view.k*100)}%)`;
}
// ---- 터치: 두 손가락으로 확대·축소(와 이동) ----
const ptrs = new Map();
let pinch = null;
function pinchStart(){
  const [a, b] = [...ptrs.values()], r = cv.getBoundingClientRect();
  const mx = (a.x + b.x)/2 - r.left, my = (a.y + b.y)/2 - r.top, v = state.view;
  pinch = { d0:Math.max(10, Math.hypot(a.x - b.x, a.y - b.y)), k0:v.k,
            wx:(mx/scale - v.x)/v.k, wy:(my/scale - v.y)/v.k };
}
function pinchMove(){
  const [a, b] = [...ptrs.values()], r = cv.getBoundingClientRect();
  const mx = (a.x + b.x)/2 - r.left, my = (a.y + b.y)/2 - r.top;
  const d = Math.hypot(a.x - b.x, a.y - b.y), v = state.view;
  const nk = Math.min(4, Math.max(0.35, pinch.k0 * d / pinch.d0));
  v.k = nk; v.x = mx/scale - pinch.wx*nk; v.y = my/scale - pinch.wy*nk;
  draw(); updateViewLabel();
}
cv.addEventListener('gesturestart', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  if (!started) return;
  if (e.pointerType === 'touch'){
    ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (ptrs.size === 2){
      e.preventDefault(); state.drag = null; state.snap = null; state.pending = state.pending.slice(0, 0);
      state.pinchedAt = Date.now(); pinchStart(); refresh(); return;
    }
    if (ptrs.size > 2) return;
  }
  if (state.tool !== 'pan' && e.button !== 1) return;     // 가운데 버튼으로도 옮길 수 있습니다
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  state.drag = { x:e.clientX - r.left, y:e.clientY - r.top, vx:state.view.x, vy:state.view.y };
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
});
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch' && ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pinch && ptrs.size >= 2){ state.pinchedAt = Date.now(); pinchMove(); return; }
  if (state.drag){
    const r = cv.getBoundingClientRect();
    state.view.x = state.drag.vx + ((e.clientX - r.left) - state.drag.x)/scale;
    state.view.y = state.drag.vy + ((e.clientY - r.top) - state.drag.y)/scale;
    draw(); return;
  }
  if ((state.tool === 'pan' || state.tool === 'hide') && !state.skill){ state.snap = null; return; }
  state.snap = (state.tool === 'point' && !state.skill) ? pointCandidate(evtPoint(e), state.pointType) : snapCandidate(evtPoint(e)); draw();
});
function pointerEnd(e){
  if (e.pointerType === 'touch'){
    ptrs.delete(e.pointerId);
    if (pinch && ptrs.size < 2){ pinch = null; state.pinchedAt = Date.now(); state.drag = null; }
  }
  if (state.drag){ state.drag = null; try { cv.releasePointerCapture(e.pointerId); } catch(_){} updateViewLabel(); }
}

// 글 속의 ⟦s:AB⟧(선분) ⟦r:AB⟧(반직선) ⟦l:AB⟧(직선)을 기호 모양으로 바꿔 줍니다
(function(){
  const RE = /⟦([srl]):([^⟧]+)⟧/g, CLS = { s:'sg', r:'ry', l:'ln' };
  function conv(node){
    const t = node.nodeValue; if (!t || t.indexOf('⟦') < 0) return;
    const frag = document.createDocumentFragment(); let last = 0, m; RE.lastIndex = 0;
    while ((m = RE.exec(t))){
      if (m.index > last) frag.appendChild(document.createTextNode(t.slice(last, m.index)));
      const sp = document.createElement('span'); sp.className = 'ov ' + CLS[m[1]]; sp.textContent = m[2];
      frag.appendChild(sp); last = m.index + m[0].length;
    }
    if (last < t.length) frag.appendChild(document.createTextNode(t.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
  function scan(root){
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), list = [];
    while (w.nextNode()) if (w.currentNode.nodeValue.indexOf('⟦') >= 0) list.push(w.currentNode);
    list.forEach(conv);
  }
  new MutationObserver(ms => { for (const m of ms){
    if (m.type === 'characterData') conv(m.target);
    else m.addedNodes.forEach(n => { if (n.nodeType === 3) conv(n); else if (n.nodeType === 1) scan(n); });
  } }).observe(document.body, { childList:true, subtree:true, characterData:true });
  window.mathSymbols = scan;
})();
</script>
